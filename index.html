<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>એન્જિન ડિસમેન્ટલિંગ લેબ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;700;800&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ITI lab page — header with language switch, sticky tabs (Simulator · Theory · MCQ); simulator = big 3D bay with part-name banner (sticky on desktop) + stacked control cards. */
:root{
  --bg:#f3efe7;--panel:#fffdf9;--panel2:#f7f2e8;--ink:#1c232c;--mute:#5d6672;--line:#ddd5c6;
  --acc:#e2620b;--acc2:#b84d06;--accInk:#fff;--hl:#d4147f;--hlSoft:#d4147f1f;
  --in:#0284c7;--cmp:#d35400;--pow:#d4a000;--exh:#111111;--ok:#16884a;--bad:#d42a2a;
  --bay:#dfe7ee;--shadow:0 1px 0 #0000000a,0 6px 18px -10px #3a2a1040;
  --fd:"Baloo Bhai 2","Noto Sans Gujarati","Noto Sans Devanagari",system-ui,sans-serif;
  --fb:"Noto Sans Gujarati","Noto Sans Devanagari","Baloo Bhai 2",system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151a;--panel:#191f26;--panel2:#1f262f;--ink:#e8ecf0;--mute:#97a2ae;--line:#2c3540;
  --acc:#ff7a22;--acc2:#ff9a52;--accInk:#1a0d02;--hl:#ff4fb0;--hlSoft:#ff4fb02a;
  --in:#7dd3fc;--cmp:#ff8c42;--pow:#ffe14d;--exh:#9ca3af;--ok:#3fcf7d;--bad:#ff5c5c;
  --bay:#1a222b;--shadow:0 1px 0 #0000,0 8px 22px -12px #000c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151a;--panel:#191f26;--panel2:#1f262f;--ink:#e8ecf0;--mute:#97a2ae;--line:#2c3540;
  --acc:#ff7a22;--acc2:#ff9a52;--accInk:#1a0d02;--hl:#ff4fb0;--hlSoft:#ff4fb02a;
  --in:#7dd3fc;--cmp:#ff8c42;--pow:#ffe14d;--exh:#9ca3af;--ok:#3fcf7d;--bad:#ff5c5c;
  --bay:#1a222b;--shadow:0 1px 0 #0000,0 8px 22px -12px #000c;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--fb);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.wrap{max-width:1280px;margin:0 auto;padding:12px 16px 40px}
/* embedded in a blog iframe that sizes itself to the page: fixed heights (vh would grow the frame forever) */
html.embed .bay{height:460px}@media (min-width:980px){html.embed .bay,html.embed .simmain.demo .bay{height:720px;max-height:none}html.embed .simmain.demo .bay{height:560px}}
html.embed body.fs .bay{height:calc(100vh - 96px)}
body.fs .wrap{max-width:none;padding-top:8px}body.fs .bay{max-height:none!important}
body.fsx{position:fixed;inset:0;overflow:auto;z-index:100;background:var(--bg)}
#fsBtn{font-weight:700;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);line-height:1.2;text-wrap:balance;margin:0}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 10px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--acc);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 #0003}
.logo svg{width:32px;height:32px}
.brand{flex:1 1 220px;min-width:0}
.brand h1{font-size:clamp(21px,4.6vw,30px);font-weight:800}
.brand p{margin:0;color:var(--mute);font-size:13px}
.hctl{display:flex;gap:8px;align-items:center;margin-left:auto}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel2);padding:7px 11px;font-size:13px;font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:6px 0 10px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 2px;font-family:var(--fd);font-weight:700;font-size:clamp(13px,3.4vw,17px);line-height:1.2;box-shadow:0 3px 0 var(--line)}
.tab .ti{display:block;font-size:19px;line-height:1.1}
.tab[aria-selected="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc2);box-shadow:0 3px 0 var(--acc2)}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);min-width:0}
.ctitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--fd);font-weight:700;font-size:17px;margin-bottom:8px}
.ctitle small{font-family:var(--fb);font-weight:400;color:var(--mute);font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;box-shadow:0 2px 0 var(--line);line-height:1.2}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc2);color:var(--accInk);box-shadow:0 2px 0 var(--acc2)}
.btn.grn{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 2px 0 #0b5c31}
.btn.on{outline:2.5px solid var(--acc);outline-offset:-2px;background:color-mix(in srgb,var(--acc) 12%,var(--panel))}
input[type=range]{width:100%;accent-color:var(--acc);height:26px}

/* simulator layout */
.simgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.bay{scroll-margin-top:84px;position:relative;height:62vh;min-height:360px;border-radius:18px;overflow:hidden;background:var(--bay);border:1px solid var(--line);box-shadow:var(--shadow)}
@media (min-width:980px){.simgrid{grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr)}.simmain{position:sticky;top:78px;align-self:start}.bay{height:calc(100vh - 96px);max-height:780px}.side{display:grid;gap:12px;align-content:start}.simmain.demo .bay{height:calc(100vh - 290px);min-height:380px}}
@media (max-width:979px){.side{display:grid;gap:12px}}
#view{position:absolute;inset:0;cursor:grab}
#view.pick{cursor:pointer}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.banner{position:absolute;left:10px;right:10px;top:10px;z-index:4;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:2px solid var(--c,var(--line));box-shadow:0 6px 18px -8px #0006;pointer-events:none;transition:border-color .2s}
.banner .num{flex:none;min-width:38px;height:38px;border-radius:12px;background:var(--c,var(--mute));color:#fff;display:grid;place-items:center;font-family:var(--fm);font-weight:700;font-size:15px;padding:0 6px}
.banner .bt{min-width:0}
.banner .bn{font-family:var(--fd);font-weight:800;font-size:clamp(18px,3.4vw,26px);line-height:1.1;color:var(--ink)}
.banner .bs{font-size:12.5px;color:var(--mute);font-weight:600}
.banner.empty .bn{font-size:clamp(15px,2.8vw,19px);color:var(--mute)}
.banner.quiz{--c:var(--hl)}
.boost{margin-top:6px;font-size:13px;color:var(--mute)}.boost b{color:#0891b2}
.banner .cd{position:absolute;left:0;bottom:0;height:5px;border-radius:0 0 0 12px;background:var(--c,var(--acc));width:0}
.demoCap{margin-top:10px;padding:10px 12px 12px;border-radius:14px;background:var(--panel);border:2px solid var(--acc);box-shadow:var(--shadow)}
.dcTop{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dcStep{font-size:12px;font-weight:700;color:#fff;background:var(--acc);border-radius:999px;padding:1px 10px}
.dcBtns{display:flex;gap:4px}
.dcBtns button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;width:36px;height:32px;font-size:15px}
.dcTitle{font-family:var(--fd);font-weight:800;font-size:clamp(17px,2.6vw,22px);margin:6px 0 2px;color:var(--acc2)}
.dcText{font-size:14.5px;line-height:1.55}
.dcText .dcSub{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.dcBar{height:5px;border-radius:3px;background:var(--panel2);margin-top:8px;overflow:hidden}
.dcBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#9333ea)}
.demo .dbtns{display:grid;grid-template-columns:1fr;gap:6px}
.demo .dbtns .btn{text-align:left;font-size:15px;padding:10px 12px}
.drow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:700;color:var(--mute)}
.demo .chip{box-shadow:none}
.smokecap{font-size:12.5px;color:var(--mute);margin:4px 0 0}
.galleg{position:absolute;right:10px;top:76px;z-index:4;display:grid;gap:3px;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);font-size:12.5px;font-weight:700;pointer-events:none}
.galleg i{display:inline-block;width:22px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.gaslab{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,-50%);padding:2px 6px;border-radius:8px;background:var(--c);color:#fff;font:700 10.5px/1.25 var(--fm);text-align:center;white-space:nowrap;box-shadow:0 2px 6px #0005}
.cyl .pt{display:block;font-family:var(--fm);font-size:11px;color:var(--ink);line-height:1.35;font-variant-numeric:tabular-nums}
.cyl .ev{display:block;font-style:normal;font-size:11.5px;font-weight:700;min-height:17px;color:var(--c)}
.pbar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:3px}
.pbar i{display:block;height:100%;background:var(--c);width:0}
.tag3d{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,-100%);padding:3px 9px;border-radius:999px;background:var(--c,#333);color:#fff;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 3px 8px #0004}
.tag3d::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:14px;background:var(--c,#333);transform:translateX(-50%)}
.mini{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-50%);padding:1px 6px;border-radius:999px;background:var(--c,#333);color:#fff;font-weight:700;font-size:11px;white-space:nowrap;opacity:.92}
.tip{position:absolute;z-index:5;pointer-events:none;padding:4px 9px;background:var(--ink);color:var(--bg);border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;transform:translate(12px,14px)}
.bayctl{position:absolute;left:10px;bottom:10px;right:10px;z-index:4;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.bayctl>*{pointer-events:auto}
.chip{border:1.5px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;box-shadow:0 2px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc2);box-shadow:0 2px 0 var(--acc2)}

/* inspector */
.insp .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#fff;background:var(--c,var(--mute));border-radius:999px;padding:2px 10px}
.insp h2{font-size:24px;font-weight:800;margin:6px 0 4px;color:var(--c,var(--ink))}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line)}
.pill.ready{border-color:var(--acc);color:var(--acc2);background:color-mix(in srgb,var(--acc) 10%,var(--panel))}
.pill.removed{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.pill.blocked{color:var(--mute)}
.desc{margin:8px 0;font-size:15px}
.prow2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;margin:8px 0;font-size:14px;padding:8px 10px;border-radius:12px;background:var(--panel2)}
.prow2 b{font-family:var(--fd);color:var(--mute);font-size:13.5px;white-space:nowrap}
.why{font-size:13.5px;border-left:4px solid var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 9%,var(--panel));border-radius:10px;padding:6px 10px;margin:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.hintl{margin:6px 0 0;padding-left:20px;font-size:14px}
.hintl li{margin:3px 0}

/* step card */
.next{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.next .what{flex:1 1 160px;min-width:0}
.next .what small{display:block;font-size:12px;color:var(--mute);font-weight:700}
.next .what strong{font-family:var(--fd);font-size:19px;line-height:1.2}
.prog{height:12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#0ea5e9,#9333ea);width:0;transition:width .35s}
.progt{font-size:12.5px;color:var(--mute);font-weight:700}
.row3{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* controls */
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 0;font-size:13.5px;font-weight:700;color:var(--mute)}
.crow output{font-family:var(--fm);color:var(--ink);min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.togs{display:flex;gap:6px;flex-wrap:wrap}

/* cycle */
.cyc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cyl{border-radius:12px;padding:6px 8px;background:color-mix(in srgb,var(--c,var(--mute)) 14%,var(--panel));border:2px solid var(--c,var(--line));text-align:center;min-width:0;transition:background .2s,border-color .2s}
.cyl b{display:block;font-family:var(--fm);font-size:11.5px;color:var(--mute)}
.cyl span{font-family:var(--fd);font-weight:800;font-size:15px;color:var(--c,var(--ink))}
.cyclegend{font-size:12.5px;color:var(--mute);margin-top:6px}

/* parts list */
.stage{margin:10px 0 4px;font-family:var(--fd);font-weight:800;font-size:14px;color:var(--acc2);display:flex;align-items:center;gap:6px}
.stage::after{content:"";flex:1;height:1px;background:var(--line)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:5px 8px;font-size:13.5px;font-weight:600}
.prow i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--fm);font-size:11.5px;font-weight:700}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .st{font-size:14px}
.prow.removed{opacity:.6}
.prow.removed .nm{text-decoration:line-through}
.prow.ready{border-color:var(--acc)}
.prow[aria-current="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--panel));box-shadow:0 0 0 2px var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--mute);margin-top:8px}
.syschips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.syschips span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px 1px 4px;background:var(--panel2);border:1px solid var(--line)}
.syschips span i{width:12px;height:12px;border-radius:50%;background:var(--c)}

/* identify game */
.gq{font-family:var(--fd);font-weight:800;font-size:18px;margin:4px 0 8px}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:9px 11px;font-size:15px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-family:var(--fm);font-size:12px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel));box-shadow:0 3px 0 var(--ok)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel));box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gscore{display:flex;gap:12px;flex-wrap:wrap;font-weight:800;font-size:14px;color:var(--mute)}
.gscore b{color:var(--ink);font-family:var(--fm)}

/* theory */
.th{display:grid;gap:12px;max-width:860px;margin:0 auto}
.thhero{text-align:center;padding:6px 6px 0}
.thhero p{color:var(--mute);margin:4px 0 0}
.th .card h2{font-size:21px;font-weight:800;display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.th .card h2 .n{font-family:var(--fm);font-size:13px;color:var(--accInk);background:var(--acc);border-radius:8px;padding:1px 7px}
.th p{margin:.45em 0}
.th ul,.th ol{margin:.3em 0;padding-left:1.3em}
.th li{margin:.25em 0}
.tb{border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15px;line-height:1.6;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.tb>b:first-child{color:var(--c)}
.formula{font-family:var(--fm);font-weight:700;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.7;overflow-x:auto}
.strokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:8px 0}
.sk{border:2px solid var(--c);border-radius:14px;padding:10px;background:color-mix(in srgb,var(--c) 9%,var(--panel));font-size:14px}
.sk b{display:block;font-family:var(--fd);font-size:19px;color:var(--c);line-height:1.1}
.sk small{display:block;color:var(--mute);font-weight:700;margin:2px 0 4px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel2);font-family:var(--fd)}
.tbl td.c{text-align:center;font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.see{margin-top:6px;border:1.5px solid var(--hl);color:var(--hl);background:var(--hlSoft);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13.5px}

/* mcq */
.mq{max-width:760px;margin:0 auto;display:grid;gap:12px}
.mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-family:var(--fd);font-weight:800;font-size:18px}
.score b{color:var(--ok)}
.mprog{flex:1;min-width:120px;height:10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.mprog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.qno{font-family:var(--fm);font-size:12px;color:var(--mute)}
.qtext{font-family:var(--fd);font-weight:700;font-size:20px;margin:4px 0 10px;line-height:1.35}
.opts{display:grid;gap:8px}
.mq .opt{font-size:16px;padding:10px 12px}
.expl{border-radius:14px;padding:10px 12px;font-size:15px;background:var(--panel2);border-left:5px solid var(--ok)}
.expl.bad{border-left-color:var(--bad)}

part('fuelRegulator',{sys:'fuel',dir:[-1,0.3,-0.5],dist:1.2,requires:['engineCover'],

  d:A('રેલના છેડે ડાયાફ્રામ અને સ્પ્રિંગવાળો વાલ્વ. વધારાનું પેટ્રોલ રિટર્ન લાઇનથી ટાંકીમાં પાછું મોકલી રેલનું દબાણ ≈ 3 bar રાખે. ઉપરની હોઝ મેનીફોલ્ડ સાથે જોડાય, જેથી દબાણ હંમેશાં મેનીફોલ્ડ કરતાં 3 bar વધુ રહે — વેક્યુમમાં ઘટે, ટર્બો બૂસ્ટમાં વધે. આથી ઇન્જેક્ટર ખુલ્લો રહે તેટલા સમયમાં હંમેશાં સરખું પેટ્રોલ છંટાય.','रेल के सिरे पर डायाफ्राम और स्प्रिंग वाला वाल्व. अतिरिक्त पेट्रोल रिटर्न लाइन से टंकी में वापस भेजकर रेल का दबाव ≈ 3 bar रखता है. ऊपर की होज़ मैनिफोल्ड से जुड़ती है, ताकि दबाव हमेशा मैनिफोल्ड से 3 bar ज़्यादा रहे — वैक्यूम में घटे, टर्बो बूस्ट में बढ़े. इससे इंजेक्टर जितनी देर खुला रहे उतने समय में हमेशा बराबर पेट्रोल छिड़कता है.','A diaphragm-and-spring valve on the end of the rail. It sends surplus petrol back to the tank through the return line to hold rail pressure at ≈ 3 bar. Its hose to the manifold keeps the rail always 3 bar above manifold pressure — lower under vacuum, higher under turbo boost — so an injector open for a given time always sprays the same amount of fuel.'),

  h:A('હાથથી અથવા નાના પુલરથી ખેંચો; વુડરફ કી પડી ન જાય તે સાચવો.','हाथ से या छोटे पुलर से खींचें; वुडरफ की गिर न जाए, सँभालें.','Pull off by hand or with a small puller; don\'t lose the Woodruff key.')},g=>{
  const r=new THREE.Group();r.name='spin';g.add(r);r.add(mesh(extX(gearShape(0.2,21,0.02,0.05),0.2,0,4),M.steel,2.17,0,0));r.add(mesh(rbox(0.02,0.04,0.02,0.004,0.004),M.yellow,2.275,0.17,0));
});
part('valveCoverGasket',{sys:'top',dir:[0,1,0.9],dist:1.6,requires:['valveCover'],
  n:A('વાલ્વ કવર ગાસ્કેટ','वाल्व कवर गैस्केट','Valve cover gasket'),
  d:A('વાલ્વ કવર અને હેડ વચ્ચે રબરની સીલ. જૂની થઈ કડક બને તો ઓઇલ લીક થઈ ગરમ એક્ઝોસ્ટ પર પડે અને બળવાની ગંધ આવે.','वाल्व कवर और हेड के बीच रबर की सील. पुरानी होकर सख्त हो तो ऑयल लीक होकर गर्म एग्ज़ॉस्ट पर गिरता है और जलने की गंध आती है.','Rubber seal between valve cover and head. When it hardens with age, oil leaks onto the hot exhaust and smells of burning.'),
  m:A('રબર (ACM / સિલિકોન)','रबर (ACM / सिलिकॉन)','Rubber (ACM / silicone)'),s:A('એક ટુકડો','एक टुकड़ा','One piece'),f:A('કવર બોલ્ટથી દબાય','कवर बोल्ट से दबती है','Clamped by the cover bolts'),
  h:A('ખાંચમાંથી હાથથી કાઢો. નવું લગાવતાં ખૂણે (હાફ-મૂન) થોડું સીલન્ટ લગાવો.','खाँचे से हाथ से निकालें. नया लगाते समय कोनों (हाफ-मून) पर थोड़ा सीलेंट लगाएँ.','Peel it out of the groove by hand. When refitting, dab sealant at the half-moon corners.')},g=>{
  const sh=rrShape(4.0,1.52,0.06);sh.holes.push(rrPath(3.8,1.32,0.05,0,0));g.add(mesh(extY(sh,0.02,0,8),M.gasketR,0,2.75,0));
});
part('cmpSensor',{sys:'elec',dir:[-1,0.4,0],dist:1.3,
  n:A('કેમશાફ્ટ પોઝિશન સેન્સર (CMP)','कैमशाफ्ट पोज़िशन सेंसर (CMP)','Camshaft position sensor (CMP)'),
  d:A('કેમશાફ્ટના છેડા પરના નિશાનથી ECU ને કહે કે સિલિન્ડર 1 કમ્પ્રેશનમાં છે કે એક્ઝોસ્ટમાં — જેથી સાચા સિલિન્ડરમાં ઇન્જેક્શન અને સ્પાર્ક થાય.','कैमशाफ्ट के सिरे पर निशान से ECU को बताता है कि सिलेंडर 1 कम्प्रेशन में है या एग्ज़ॉस्ट में — ताकि सही सिलेंडर में इंजेक्शन और स्पार्क हो.','Reads a target on the camshaft end so the ECU knows whether cylinder 1 is on compression or exhaust — so injection and spark go to the right cylinder.'),
  m:A('હોલ ઇફેક્ટ સેન્સર','हॉल इफ़ेक्ट सेंसर','Hall-effect sensor'),s:A('5 V સપ્લાય','5 V सप्लाई','5 V supply'),f:A('M6, 8 N·m','M6, 8 N·m','M6, 8 N·m'),
  h:A('કનેક્ટર કાઢો → 10 mm બોલ્ટ ખોલો → સેન્સર સીધું ખેંચો.','कनेक्टर निकालें → 10 mm बोल्ट खोलें → सेंसर सीधा खींचें.','Unplug → undo the 10 mm bolt → pull the sensor straight out.')},g=>{
  sensor(g,V(-2.0,CAM_Y,0.4),V(-1,0,0),{ear:0.18,body:[0.045,0.1,M.sensorBody],plug:[0.1,0.08,0.09,M.plugBlack]}); // Hall sensor reading the cam trigger wheel
});
part('oilPanGasket',{sys:'lube',dir:[0,-1,0],dist:0.8,requires:['oilPan'],
  n:A('ઓઇલ પેન ગાસ્કેટ','ऑयल पैन गैस्केट','Oil pan gasket'),
  d:A('સમ્પ અને બ્લોક વચ્ચે સીલ. ઘણા એન્જિનમાં ગાસ્કેટને બદલે RTV સીલન્ટ વપરાય.','संप और ब्लॉक के बीच सील. कई इंजनों में गैस्केट की जगह RTV सीलेंट इस्तेमाल होता है.','Seals the sump to the block. Many engines use RTV sealant instead of a gasket.'),
  m:A('રબર / કોર્ક / RTV','रबर / कॉर्क / RTV','Rubber / cork / RTV'),s:A('3 mm બીડ','3 mm बीड','3 mm bead'),f:A('પેન બોલ્ટથી દબાય','पैन बोल्ट से दबता है','Clamped by the pan bolts'),
  h:A('સ્ક્રેપરથી જૂનું સીલન્ટ સાફ કરો; ઘસરકા ન પડે. ફરી લગાવતાં 3 mm બીડ, 10 મિનિટમાં પેન લગાવો.','स्क्रेपर से पुराना सीलेंट साफ करें; खरोंच न आए. दोबारा लगाते समय 3 mm बीड, 10 मिनट में पैन लगाएँ.','Scrape off old sealant without scoring. On refit lay a 3 mm bead and fit the pan within 10 minutes.')},g=>{
  const sh=rrShape(4.04,1.84,0.06);sh.holes.push(rrPath(3.7,1.5,0.05,0,0));g.add(mesh(extY(sh,0.012,0,8),M.gasketR,0,-0.556,0));
});
part('oilPump',{sys:'lube',dir:[1,-0.3,0],dist:1.0,requires:['crankSprocket','oilPickup','crankPulley'],
  n:A('ઓઇલ પંપ','ऑयल पंप','Oil pump'),
  d:A('ક્રેન્કશાફ્ટથી સીધો ચાલતો ગિયર (ટ્રોકોઇડલ) પંપ. સમ્પમાંથી ઓઇલ ખેંચી દબાણ સાથે ફિલ્ટર અને ગેલેરીમાં મોકલે. અંદરનો રિલીફ વાલ્વ વધુ દબાણ રોકે. આગળનું ક્રેન્ક ઓઇલ સીલ પણ તેમાં હોય.','क्रैंकशाफ्ट से सीधे चलने वाला गियर (ट्रोकोइडल) पंप. संप से ऑयल खींचकर दबाव के साथ फ़िल्टर और गैलरी में भेजता है. अंदर का रिलीफ़ वाल्व ज़्यादा दबाव रोकता है. आगे की क्रैंक ऑयल सील भी इसी में होती है.','A gear (trochoid) pump driven straight off the crankshaft. It draws oil from the sump and pushes it under pressure to the filter and galleries. A relief valve limits pressure. It also carries the front crank seal.'),
  m:A('એલ્યુમિનિયમ હાઉસિંગ, સ્ટીલ રોટર','एल्यूमिनियम हाउसिंग, स्टील रोटर','Aluminium housing, steel rotors'),s:A('≈ 4 bar @ 3000 rpm','≈ 4 bar @ 3000 rpm','≈ 4 bar @ 3000 rpm'),f:A('M6, 10 N·m','M6, 10 N·m','M6, 10 N·m'),
  h:A('ક્રેન્ક સ્પ્રોકેટ અને પિકઅપ કાઢ્યા પછી 10 mm બોલ્ટ ખોલો → પ્લાસ્ટિક હેમરથી હળવેથી ટેપ કરી છૂટો કરો → નવું ગાસ્કેટ અને ફ્રન્ટ સીલ.','क्रैंक स्प्रोकेट और पिकअप निकालने के बाद 10 mm बोल्ट खोलें → प्लास्टिक हथौड़े से हल्का ठोककर छुड़ाएँ → नया गैस्केट और फ्रंट सील.','With the crank sprocket and pickup off, undo the 10 mm bolts → tap it free with a plastic mallet → fit a new gasket and front seal.')},g=>{
  const sh=rrShape(0.9,0.62,0.22);sh.holes.push(circlePath(0,0.08,0.19));g.add(mesh(extX(sh,0.07,0.01,16),M.alu,2.03,-0.08,0));
  const seal=mesh(new THREE.TorusGeometry(0.17,0.02,8,28),M.rubber,2.07,0,0);seal.rotation.y=Math.PI/2;g.add(seal);
  g.add(mesh(rbox(0.06,0.12,0.16,0.02),M.alu,2.05,-0.3,0.3));
  [[0.3,0.12],[-0.3,0.12],[0.3,-0.3],[-0.3,-0.3]].forEach(([z,y])=>bolt(g,2.07,y,z,'x'));
});
part('rearSeal',{sys:'bottom',dir:[-1,0,0],dist:0.6,requires:['flywheel'],
  n:A('રિયર ક્રેન્ક ઓઇલ સીલ','रियर क्रैंक ऑयल सील','Rear crankshaft oil seal'),
  d:A('ક્રેન્કશાફ્ટના પાછળના છેડે ઓઇલને ક્લચ તરફ લીક થતું રોકે. લીક થાય તો ક્લચ પ્લેટ ઓઇલવાળી થઈ સ્લિપ થાય.','क्रैंकशाफ्ट के पीछे के सिरे पर ऑयल को क्लच की ओर लीक होने से रोकती है. लीक हो तो क्लच प्लेट ऑयल वाली होकर स्लिप करती है.','Stops oil leaking from the back of the crankshaft towards the clutch. A leak soaks the clutch plate and makes it slip.'),
  m:A('એલ્યુમિનિયમ હાઉસિંગ, રબર લિપ સીલ','एल्यूमिनियम हाउसिंग, रबर लिप सील','Aluminium housing, rubber lip seal'),s:A('Ø 85 mm','Ø 85 mm','Ø 85 mm'),f:A('M6, 10 N·m','M6, 10 N·m','M6, 10 N·m'),
  h:A('ફ્લાયવ્હીલ કાઢ્યા પછી 10 mm બોલ્ટ ખોલો → હાઉસિંગ ઉતારો. નવું સીલ સીધું દબાવો અને લિપ પર ઓઇલ લગાવો.','फ्लाईव्हील निकालने के बाद 10 mm बोल्ट खोलें → हाउसिंग उतारें. नई सील सीधी दबाएँ और लिप पर ऑयल लगाएँ.','With the flywheel off, undo the 10 mm bolts → remove the housing. Press the new seal in square and oil its lip.')},g=>{
  const sh=rrShape(0.95,0.85,0.22);sh.holes.push(circlePath(0,0,0.31));g.add(mesh(extX(sh,0.04,0,16),M.alu,-2.025,0,0));
  const t=mesh(new THREE.TorusGeometry(0.31,0.022,8,32),M.rubber,-2.047,0,0);t.rotation.y=Math.PI/2;g.add(t);
  for(let i=0;i<4;i++){const a=Math.PI/4+i*Math.PI/2;bolt(g,-2.045,Math.cos(a)*0.4,Math.sin(a)*0.4,'-x');}
});
part('mainBearings',{sys:'bottom',dir:[0,-1,0],dist:0.35,requires:['crankshaft'],
  n:A('મેઇન બેરિંગ શેલ (ઉપરના)','मेन बेयरिंग शेल (ऊपर के)','Main bearing shells (upper)'),
  d:A('ક્રેન્કશાફ્ટ સીધો લોખંડ પર ન ફરે — આ પાતળા અર્ધ-ગોળ શેલ પર ઓઇલની પાતળી ફિલ્મ પર ફરે. ઉપરના શેલમાં ઓઇલ હોલ અને ખાંચ હોય; નીચેના શેલ મેઇન કેપમાં હોય.','क्रैंकशाफ्ट सीधे लोहे पर नहीं घूमता — इन पतले अर्ध-गोल शेल पर ऑयल की पतली परत पर घूमता है. ऊपर के शेल में ऑयल होल और खाँचा होता है; निचले शेल मेन कैप में होते हैं.','The crank never turns on bare iron — it runs on a thin oil film inside these half-round shells. The upper shells have the oil hole and groove; the lower shells sit in the main caps.'),
  m:A('સ્ટીલ બેક + એલ્યુમિનિયમ-ટીન લાઇનિંગ','स्टील बैक + एल्यूमिनियम-टिन लाइनिंग','Steel back + aluminium-tin lining'),s:A('ક્લિયરન્સ 0.02–0.05 mm','क्लीयरेंस 0.02–0.05 mm','Clearance 0.02–0.05 mm'),f:A('ટેબથી લૉક','टैब से लॉक','Located by a tab'),
  h:A('શેલને ટેબની વિરુદ્ધ બાજુથી આંગળીથી સરકાવી કાઢો → જગ્યા પ્રમાણે નિશાન રાખો. ફરી લગાવતાં પ્લાસ્ટિગેજથી ક્લિયરન્સ માપો.','शेल को टैब की उल्टी तरफ से उँगली से सरकाकर निकालें → जगह के अनुसार निशान रखें. दोबारा लगाते समय प्लास्टिगेज से क्लीयरेंस मापें.','Slide each shell out with a thumb from the side opposite its tab → mark its position. On refit, check clearance with Plastigauge.')},g=>{
  const upG=new THREE.CylinderGeometry(0.19,0.19,0.11,28,1,true,0,Math.PI);upG.rotateZ(Math.PI/2);JOURNALS.forEach(x=>g.add(mesh(upG,M.shell,x,0,0)));
});

part('mafSensor',{sys:'air',dir:[0,1,0.3],dist:1.4,
  n:A('MAF સેન્સર (માસ એર ફ્લો + IAT)','MAF सेंसर (मास एयर फ्लो + IAT)','MAF sensor (mass air flow + IAT)'),
  d:A('ગરમ ફિલ્મ પરથી પસાર થતી હવા તેને ઠંડી કરે — કેટલી ઠંડી થઈ તેના પરથી દર સેકન્ડે કેટલા ગ્રામ હવા અંદર જાય તે માપે. અંદર હવાનું તાપમાન સેન્સર (IAT) પણ છે. ECU આ પરથી ફ્યુઅલ નક્કી કરે.','गर्म फिल्म के ऊपर से गुजरती हवा उसे ठंडा करती है — कितनी ठंडी हुई उससे हर सेकंड कितने ग्राम हवा अंदर जाती है यह मापता है. अंदर हवा का तापमान सेंसर (IAT) भी है. ECU इससे फ्यूल तय करता है.','Air passing a heated film cools it; how much it cools gives the grams of air per second. An intake-air temperature (IAT) sensor is built in. The ECU meters fuel from it.'),
  m:A('પ્લાસ્ટિક હાઉસિંગ, હોટ-ફિલ્મ ચિપ','प्लास्टिक हाउसिंग, हॉट-फिल्म चिप','Plastic housing, hot-film chip'),s:A('5-પિન, 0–5 V','5-पिन, 0–5 V','5-pin, 0–5 V'),f:A('2 × Torx T20 સ્ક્રૂ','2 × Torx T20 स्क्रू','2 × Torx T20 screws'),
  h:A('કનેક્ટર કાઢો → 2 Torx સ્ક્રૂ ખોલો → સીધું બહાર ખેંચો. સેન્સરની ફિલ્મને હાથ ન લગાવો; ફક્ત MAF ક્લીનર સ્પ્રે વાપરો.','कनेक्टर निकालें → 2 Torx स्क्रू खोलें → सीधा बाहर खींचें. सेंसर की फिल्म को हाथ न लगाएँ; सिर्फ MAF क्लीनर स्प्रे इस्तेमाल करें.','Unplug → undo 2 Torx screws → pull straight out. Never touch the sensing film; use only MAF cleaner spray.')},g=>{
  const hs=new THREE.CylinderGeometry(0.15,0.15,0.2,32,1,true);hs.rotateX(Math.PI/2);g.add(mesh(hs,M.plastic,-3.2,2.86,0.02));
  for(const z of [-0.08,0.12])g.add(mesh(new THREE.TorusGeometry(0.15,0.012,8,32),M.plastic,-3.2,2.86,z));
  sensor(g,V(-3.2,3.0,0.02),V(0,1,0),{box:[0.3,0.06,0.16,M.sensorBody],plug:[0.12,0.08,0.12,M.plugBlack],plugX:0.06});

/* ===== turbocharger system ===== */
// one smooth swept casting: a circle whose radius and spiral radius both grow over ~330°, capped at both ends
function snailGeo(R0,dR,r0,dr,turns){const N=72,Mr=18,pos=[],nrm=[],idx=[],T_=turns||0.92;
  const ring=(i)=>{const t=i/N,a=t*TAU*T_,Rc=R0+dR*t,rc=r0+dr*t,ca=Math.cos(a),sa=Math.sin(a);return {Rc,rc,ca,sa};};
  for(let i=0;i<=N;i++){const {Rc,rc,ca,sa}=ring(i);for(let j=0;j<=Mr;j++){const b=j/Mr*TAU,cb=Math.cos(b),sb=Math.sin(b);
    pos.push(rc*sb,(Rc+rc*cb)*ca,(Rc+rc*cb)*sa);nrm.push(sb,cb*ca,cb*sa);}}
  for(let i=0;i<N;i++)for(let j=0;j<Mr;j++){const a=i*(Mr+1)+j,b=a+Mr+1;idx.push(a,b,a+1,b,b+1,a+1);}
  for(const [i,sg] of [[0,-1],[N,1]]){const {Rc,ca,sa}=ring(i),c=pos.length/3,tx=-sa*sg,ty=ca*sg;pos.push(0,Rc*ca,Rc*sa);nrm.push(0,tx,ty);
    for(let j=0;j<Mr;j++){const k=i*(Mr+1)+j;pos.push(pos[k*3],pos[k*3+1],pos[k*3+2]);nrm.push(0,tx,ty);}
    for(let j=0;j<Mr;j++){const a=c+1+j,b=c+1+(j+1)%Mr;sg>0?idx.push(c,a,b):idx.push(c,b,a);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));g.setIndex(idx);return g;}
function volute(g,xc,R0,r0,mat,cy,cz){g.add(mesh(snailGeo(R0,0.1,r0,0.08),mat,xc,cy,cz));}

 airIntake:A('MAF સેન્સરનું કનેક્ટર કાઢો → સ્ક્રૂ ડ્રાઇવરથી ડક્ટનો ક્લેમ્પ ઢીલો કરો → બોક્સની ક્લિપ ખોલી ઉપાડો.','MAF सेंसर का कनेक्टर निकालें → स्क्रूड्राइवर से डक्ट का क्लैम्प ढीला करें → बॉक्स की क्लिप खोलकर उठाएँ.','Unplug the MAF sensor → loosen the duct clamp with a screwdriver → release the box clips and lift.'),
 coils:A('દરેક કોઇલનું કનેક્ટર લૉક દબાવી કાઢો → 10 mm સોકેટથી બોલ્ટ ખોલો → સીધી ઉપર ખેંચો.','हर कॉइल का कनेक्टर लॉक दबाकर निकालें → 10 mm सॉकेट से बोल्ट खोलें → सीधे ऊपर खींचें.','Press each connector lock and unplug → undo the bolt with a 10 mm socket → pull straight up.'),
 sparkPlugs:A('એન્જિન ઠંડું હોય ત્યારે જ. પહેલાં પ્લગના કૂવામાંથી હવાથી ધૂળ ઉડાવો → 16 mm પ્લગ સોકેટ + એક્સટેન્શનથી ખોલો.','इंजन ठंडा होने पर ही. पहले प्लग के कुएँ से हवा से धूल उड़ाएँ → 16 mm प्लग सॉकेट + एक्सटेंशन से खोलें.','Only on a cold engine. Blow dust out of the plug wells first → undo with a 16 mm plug socket and extension.'),
 fuelRail:A('પહેલાં ફ્યુઅલ દબાણ છોડો (ફ્યુઅલ પંપ ફ્યુઝ કાઢી એન્જિન બંધ થાય ત્યાં સુધી ચલાવો) → ઇન્જેક્ટર કનેક્ટર → ફ્યુઅલ લાઇન → 10 mm બોલ્ટ. નજીક આગ કે તણખો નહીં!','पहले फ्यूल दबाव छोड़ें (फ्यूल पंप फ्यूज़ निकालकर इंजन बंद होने तक चलाएँ) → इंजेक्टर कनेक्टर → फ्यूल लाइन → 10 mm बोल्ट. पास में आग या चिंगारी नहीं!','First release fuel pressure (pull the fuel-pump fuse and run until the engine stalls) → injector connectors → fuel line → 10 mm bolts. No flames or sparks nearby!'),
 intakeManifold:A('વેક્યૂમ હોઝ અને બ્રેકેટ કાઢો → 12 mm સોકેટથી નટ બહારથી અંદર તરફ ખોલો → સીધું ખેંચો.','वैक्यूम होज़ और ब्रैकेट निकालें → 12 mm सॉकेट से नट बाहर से अंदर की ओर खोलें → सीधा खींचें.','Remove vacuum hoses and brackets → undo the nuts outside-in with a 12 mm socket → pull straight off.'),
 heatShield:A('10 mm બોલ્ટ ખોલો; કાટ હોય તો પહેલાં પેનિટ્રેટિંગ ઓઇલ છાંટો.','10 mm बोल्ट खोलें; जंग हो तो पहले पेनिट्रेटिंग ऑयल छिड़कें.','Undo the 10 mm bolts; spray penetrating oil first if rusty.'),
 exhaustManifold:A('એન્જિન ઠંડું હોય ત્યારે જ. સ્ટડ નટ પર પેનિટ્રેટિંગ ઓઇલ → 13 mm સોકેટથી બહારથી અંદર ખોલો.','इंजन ठंडा होने पर ही. स्टड नट पर पेनिट्रेटिंग ऑयल → 13 mm सॉकेट से बाहर से अंदर खोलें.','Cold engine only. Penetrating oil on the stud nuts → undo outside-in with a 13 mm socket.'),
 thermostat:A('પહેલાં રેડિએટર ડ્રેઇનથી કૂલન્ટ કાઢો → હોઝ ક્લેમ્પ ખોલી હોઝ કાઢો → 10 mm બોલ્ટ ખોલો → નવું O-રિંગ વાપરો.','पहले रेडिएटर ड्रेन से कूलेंट निकालें → होज़ क्लैम्प खोलकर होज़ निकालें → 10 mm बोल्ट खोलें → नई O-रिंग लगाएँ.','Drain the coolant at the radiator first → undo the clamp and pull the hose → undo the 10 mm bolts → fit a new O-ring.'),
 dipstick:A('ડિપસ્ટિક ખેંચો → ટ્યુબ બ્રેકેટનો 10 mm બોલ્ટ ખોલો → ટ્યુબ ફેરવતાં ઉપર ખેંચો.','डिपस्टिक खींचें → ट्यूब ब्रैकेट का 10 mm बोल्ट खोलें → ट्यूब घुमाते हुए ऊपर खींचें.','Pull the dipstick → undo the 10 mm tube-bracket bolt → twist the tube and pull up.'),
 oilFilter:A('નીચે ઓઇલ ટ્રે રાખો → ફિલ્ટર રેન્ચથી ઘડિયાળની ઊંધી દિશામાં ખોલો.','नीचे ऑयल ट्रे रखें → फ़िल्टर रिंच से घड़ी की उल्टी दिशा में खोलें.','Put a drip tray underneath → undo anticlockwise with a filter wrench.'),
 accBelt:A('પહેલાં બેલ્ટનો ફરતો રસ્તો (ડાયાગ્રામ) જોઈ લો → 15 mm પાનાથી ટેન્શનર ઘડિયાળની દિશામાં ફેરવી ઢીલો કરો → બેલ્ટ કાઢો.','पहले बेल्ट का रास्ता (डायग्राम) देख लें → 15 mm पाने से टेंशनर घड़ी की दिशा में घुमाकर ढीला करें → बेल्ट निकालें.','Note the belt routing first → turn the tensioner clockwise with a 15 mm spanner → slip the belt off.'),
 alternator:A('બેટરીનો (−) ટર્મિનલ કાઢેલો હોવો જોઈએ → B+ નટ અને કનેક્ટર કાઢો → 13 mm ના 2 માઉન્ટ બોલ્ટ ખોલો.','बैटरी का (−) टर्मिनल निकला होना चाहिए → B+ नट और कनेक्टर निकालें → 13 mm के 2 माउंट बोल्ट खोलें.','Battery (−) must be disconnected → remove the B+ nut and connector → undo the two 13 mm mounting bolts.'),
 acCompressor:A('ગેસ ભરેલો હોય તો પાઇપ ખોલશો નહીં — ફક્ત 13 mm બોલ્ટ ખોલી કોમ્પ્રેસરને બાજુ પર બાંધી રાખો. ગેસ કાઢવો હોય તો માન્ય રિકવરી મશીનથી જ.','गैस भरी हो तो पाइप न खोलें — सिर्फ 13 mm बोल्ट खोलकर कंप्रेसर को बगल में बाँध दें. गैस निकालनी हो तो मान्य रिकवरी मशीन से ही.','If charged, never open the pipes — just undo the 13 mm bolts and tie the compressor aside. Recover refrigerant only with an approved machine.'),
 starter:A('બેટરી (−) કાઢેલી હોવી જોઈએ → સોલેનોઇડના વાયર કાઢો → 14 mm ના 2 માઉન્ટ બોલ્ટ ખોલો.','बैटरी (−) निकली होनी चाहिए → सोलेनॉइड के वायर निकालें → 14 mm के 2 माउंट बोल्ट खोलें.','Battery (−) must be off → remove the solenoid wires → undo the two 14 mm bolts.'),
 crankPulley:A('ફ્લાયવ્હીલ લૉક કરો → 19 mm સોકેટ + બ્રેકર બારથી સેન્ટર બોલ્ટ ખોલો → પુલરથી પુલી ખેંચો.','फ्लाईव्हील लॉक करें → 19 mm सॉकेट + ब्रेकर बार से सेंटर बोल्ट खोलें → पुलर से पुली खींचें.','Lock the flywheel → undo the centre bolt with a 19 mm socket and breaker bar → pull the pulley with a puller.'),
 timingCover:A('10 mm બોલ્ટ ખોલો; પહેલાં ઉપરનો ભાગ, પછી નીચેનો.','10 mm बोल्ट खोलें; पहले ऊपरी भाग, फिर निचला.','Undo the 10 mm bolts; upper half first, then the lower.'),
 timingBelt:A('પહેલાં સિલિન્ડર 1 ને TDC પર લાવી ક્રેન્ક અને કેમનાં પીળાં નિશાન મેળવો → ટેન્શનર ઢીલો કરો → બેલ્ટ કાઢો. બેલ્ટ વગર ક્રેન્ક કે કેમ ફેરવશો નહીં!','पहले सिलेंडर 1 को TDC पर लाकर क्रैंक और कैम के पीले निशान मिलाएँ → टेंशनर ढीला करें → बेल्ट निकालें. बेल्ट के बिना क्रैंक या कैम न घुमाएँ!','First set cylinder 1 to TDC and line up the yellow crank and cam marks → slacken the tensioner → remove the belt. Never turn the crank or cams with the belt off!'),
 camSprockets:A('કેમશાફ્ટને તેના હેક્સ પર પાનાથી પકડો → 17 mm બોલ્ટ ખોલો → સ્પ્રોકેટ ખેંચો.','कैमशाफ्ट को उसके हेक्स पर पाने से पकड़ें → 17 mm बोल्ट खोलें → स्प्रोकेट खींचें.','Hold the camshaft on its hex with a spanner → undo the 17 mm bolt → pull the sprocket.'),
 waterPump:A('કૂલન્ટ કાઢેલું હોવું જોઈએ → 10 mm બોલ્ટ ખોલો → પંપ કાઢો; ફરી લગાવતાં નવું ગાસ્કેટ.','कूलेंट निकला होना चाहिए → 10 mm बोल्ट खोलें → पंप निकालें; दोबारा लगाते समय नया गैस्केट.','Coolant must be drained → undo the 10 mm bolts → remove the pump; fit a new gasket on refit.'),
 valveCover:A('PCV હોઝ કાઢો → 10 mm બોલ્ટ બહારથી અંદર ખોલો → સીધું ઉપાડો; સ્ક્રૂ ડ્રાઇવરથી ઉચકશો નહીં.','PCV होज़ निकालें → 10 mm बोल्ट बाहर से अंदर खोलें → सीधा उठाएँ; स्क्रूड्राइवर से न उचकाएँ.','Remove the PCV hose → undo the 10 mm bolts outside-in → lift straight off; don\'t lever it with a screwdriver.'),
 camshafts:A('બેરિંગ કેપના બોલ્ટ બહારથી અંદર, થોડા-થોડા (અડધો આંટો) ખોલો જેથી કેમ વાંકો ન થાય → કેપ પરના નંબર અને તીર જુઓ → કેમ ઉપાડો.','बेयरिंग कैप के बोल्ट बाहर से अंदर, थोड़ा-थोड़ा (आधा चक्कर) खोलें ताकि कैम टेढ़ा न हो → कैप पर नंबर और तीर देखें → कैम उठाएँ.','Undo the cap bolts outside-in, half a turn at a time so the cam doesn\'t bend → note the numbers and arrows on the caps → lift the cams out.'),
 head:A('એન્જિન ઠંડું હોય ત્યારે જ. 10 હેડ બોલ્ટ બહારથી વચ્ચે તરફ, 2-3 તબક્કામાં ઢીલા કરો → બે જણ ઉપાડી લાકડાની બેન્ચ પર મૂકો. વાલ્વ હેડમાં જ રહે છે.','इंजन ठंडा होने पर ही. 10 हेड बोल्ट बाहर से बीच की ओर, 2-3 चरणों में ढीले करें → दो लोग उठाकर लकड़ी की बेंच पर रखें. वाल्व हेड में ही रहते हैं.','Cold engine only. Loosen the 10 head bolts from the outside towards the centre in 2-3 stages → two people lift it onto a wooden bench. The valves stay in the head.'),
 valvetrain:A('હેડ બેન્ચ પર → બકેટ ઉપાડો → વાલ્વ સ્પ્રિંગ કમ્પ્રેસરથી સ્પ્રિંગ દબાવી કોલેટ (કોટર) કાઢો → સ્પ્રિંગ અને વાલ્વ કાઢો. દરેક વાલ્વ પોતાના નંબર સાથે ક્રમમાં રાખો.','हेड बेंच पर → बकेट उठाएँ → वाल्व स्प्रिंग कम्प्रेसर से स्प्रिंग दबाकर कॉलेट (कॉटर) निकालें → स्प्रिंग और वाल्व निकालें. हर वाल्व अपने नंबर के साथ क्रम में रखें.','Head on the bench → lift out the buckets → compress each spring with a valve-spring compressor and remove the collets → take out springs and valves. Keep every valve in numbered order.'),
 headGasket:A('ઉપાડી લો → બ્લોકની સપાટી પ્લાસ્ટિક સ્ક્રેપરથી સાફ કરો → સ્ટ્રેટ-એજ અને ફીલર ગેજથી વાંકાપણું તપાસો.','उठा लें → ब्लॉक की सतह प्लास्टिक स्क्रेपर से साफ करें → स्ट्रेट-एज और फीलर गेज से टेढ़ापन जाँचें.','Lift it off → clean the deck with a plastic scraper → check flatness with a straight-edge and feeler gauge.'),
 oilPan:A('પહેલાં 17 mm ડ્રેઇન પ્લગ ખોલી ઓઇલ કાઢો → 10 mm બોલ્ટ ખોલો → પ્લાસ્ટિક વેજથી સીલન્ટ છૂટું કરી ઉતારો.','पहले 17 mm ड्रेन प्लग खोलकर ऑयल निकालें → 10 mm बोल्ट खोलें → प्लास्टिक वेज से सीलेंट छुड़ाकर उतारें.','Drain the oil at the 17 mm drain plug first → undo the 10 mm bolts → break the sealant with a plastic wedge and lower the pan.'),
 oilPickup:A('10 mm બોલ્ટ ખોલો → જાળી કેરોસીનથી સાફ કરો; ફરી લગાવતાં નવું O-રિંગ.','10 mm बोल्ट खोलें → जाली केरोसीन से साफ करें; दोबारा लगाते समय नई O-रिंग.','Undo the 10 mm bolts → clean the screen in kerosene; fit a new O-ring on refit.'),
 flywheel:A('ફ્લાયવ્હીલ લૉકિંગ ટૂલ લગાવો → 6 બોલ્ટ ક્રિસ-ક્રોસ ઢીલા કરો → ભારે છે, બંને હાથે પકડીને ઉતારો.','फ्लाईव्हील लॉकिंग टूल लगाएँ → 6 बोल्ट क्रिस-क्रॉस ढीले करें → भारी है, दोनों हाथों से पकड़कर उतारें.','Fit a flywheel locking tool → loosen the 6 bolts criss-cross → it\'s heavy, hold it with both hands.'),
 mainCaps:A('બોલ્ટ બહારથી વચ્ચે તરફ ઢીલા કરો → કેપ પરના નંબર (1–5) અને તીર (આગળ તરફ) જુઓ → નીચેના શેલ કેપમાં જ રહે છે.','बोल्ट बाहर से बीच की ओर ढीले करें → कैप पर नंबर (1–5) और तीर (आगे की ओर) देखें → निचले शेल कैप में ही रहते हैं.','Loosen the bolts from the outside towards the centre → note the cap numbers (1–5) and arrows (pointing front) → the lower shells stay in the caps.'),
 crankshaft:A('બે જણ સીધો ઉપાડો; જર્નલ પર ઘસરકા ન પડે. ઊભો (વર્ટિકલ) રાખો જેથી વાંકો ન થાય. માઇક્રોમીટરથી જર્નલની ઓવાલિટી માપો.','दो लोग सीधा उठाएँ; जर्नल पर खरोंच न आए. खड़ा (वर्टिकल) रखें ताकि टेढ़ा न हो. माइक्रोमीटर से जर्नल की ओवैलिटी मापें.','Two people lift it straight out without scratching the journals. Store it upright so it doesn\'t bend. Measure journal ovality with a micrometer.'),

/* performance: merge static meshes that share a material (bolts, ribs, slots…) into one draw call per container */
function mergeGeos(list){const parts=list.map(({geo,mat})=>{let g=geo.index?geo.toNonIndexed():geo.clone();g.applyMatrix4(mat);if(!g.attributes.normal)g.computeVertexNormals();return g;});
  let n=0;parts.forEach(g=>n+=g.attributes.position.count);const P_=new Float32Array(n*3),N_=new Float32Array(n*3),U_=new Float32Array(n*2);let o=0;
  parts.forEach(g=>{const c=g.attributes.position.count;P_.set(g.attributes.position.array,o*3);N_.set(g.attributes.normal.array,o*3);if(g.attributes.uv)U_.set(g.attributes.uv.array,o*2);o+=c;g.dispose();});
  const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(P_,3));m.setAttribute('normal',new THREE.BufferAttribute(N_,3));m.setAttribute('uv',new THREE.BufferAttribute(U_,2));m.computeBoundingSphere();return m;}
function mergeStatic(root){const conts=[];root.traverse(o=>{if(!o.isMesh&&!o.userData.st)conts.push(o);});
  conts.forEach(c=>{const by=new Map();const add=(mesh,mat,owner)=>{const k=mesh.material;if(!by.has(k))by.set(k,[]);by.get(k).push({geo:mesh.geometry,mat,owner});};
    c.children.slice().forEach(ch=>{ch.updateMatrix();

  if(!id){state.pending=null;select(null);return;}

  select(id,fromList);const p=P[id];
  if(state.tap&&!D.mode&&status(p)==='ready'){state.pending={id,t:1.5,T:1.5};renderBanner();}
  else{state.pending=null;if(state.tap&&status(p)==='blocked'){toast('🔒 '+tx('પહેલાં ખોલો: ','पहले खोलें: ','Remove first: ')+p.requires.filter(r=>!P[r].removed).map(nm).join(', '));buzz(40);}}
}

const box=new THREE.Box3();
function frame(id,close){const p=P[id];const was=p.group.visible;p.group.visible=true;box.setFromObject(p.group);p.group.visible=was;
  const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3()).length();const dir=camera.position.clone().sub(controls.target).normalize();
  animCam(c,c.clone().addScaledVector(dir,Math.max(2.8,s*(close?1.25:1.6)+1)));}
function frameFrom(id){const p=P[id];const was=p.group.visible;p.group.visible=true;box.setFromObject(p.group);p.group.visible=was;
  const c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3()).length();
  const cur=camera.position.clone().sub(controls.target).normalize();const d=p.dirV.clone().multiplyScalar(1.2).add(cur.multiplyScalar(0.7));d.y=Math.max(d.y,0.35);d.normalize();
  animCam(c,c.clone().addScaledVector(d,Math.max(4.2,sz*1.5+2.2)));}
function frameHome(){animCam(HOME_TGT.clone(),HOME_CAM.clone());}

/* ---------------- picking ---------------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();const tip=$('tip');
function pick(cx,cy){const r=renderer.domElement.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObject(engine,true);let ghost=null;
  for(const h of hits){const id=h.object.userData.pid;if(!id)continue;const p=P[id];if(p.fade<0.5)continue;
    if(state.cut&&!p.internal&&!state.iso&&h.point.z>0.001)continue;
    if(state.xray&&(p.housing||p.xsee)&&!state.iso){ghost=ghost||id;continue;}return id;}
  return ghost;}
let down=null,lastMove=0;
renderer.domElement.addEventListener('pointerdown',e=>{ac();down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6){if(state.quiz){toast(tx('ગુલાબી ભાગનું નામ નીચે પસંદ કરો','गुलाबी भाग का नाम नीचे चुनें','Pick the pink part\'s name below'));}else{const id=pick(e.clientX,e.clientY);tapPart(id);}}down=null;});
renderer.domElement.addEventListener('dblclick',e=>{const id=pick(e.clientX,e.clientY);if(id&&!state.quiz)frame(id);});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons)return;const now=performance.now();if(now-lastMove<40)return;lastMove=now;
  const id=state.quiz?null:pick(e.clientX,e.clientY);state.hover=id;view.classList.toggle('pick',!!id);
  if(id){const r=$('bay').getBoundingClientRect();tip.hidden=false;tip.textContent=nm(id);tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';}else tip.hidden=true;});
renderer.domElement.addEventListener('pointerleave',()=>{state.hover=null;tip.hidden=true;});

const tag=$('tag3d'),minis=$('minis');const pv=new THREE.Vector3();
function project(p){pv.copy(p.center).add(p.group.position).project(camera);const w=view.clientWidth,h=view.clientHeight;return {x:(pv.x+1)/2*w,y:(1-pv.y)/2*h,ok:pv.z<1&&pv.z>-1};}
let miniPool=[];
function updateLabels(){
  const p=P[state.sel];
  if(p&&!state.quiz&&p.group.visible&&p.fade>0.5){const q=project(p);if(q.ok){tag.hidden=false;tag.style.setProperty('--c',SYS[p.sys].c);tag.style.background=SYS[p.sys].c;tag.textContent=(p.fixed?'':stepNo(p.id)+'. ')+nm(p.id);tag.style.left=q.x+'px';tag.style.top=(q.y-14)+'px';}else tag.hidden=true;}else tag.hidden=true;
  if(!state.labels||state.quiz){if(miniPool.length){minis.innerHTML='';miniPool=[];}return;}
  if(miniPool.length!==ORDER.length){minis.innerHTML='';miniPool=ORDER.map(id=>{const d=document.createElement('div');d.className='mini';d.style.background=SYS[P[id].sys].c;minis.appendChild(d);return d;});}
  ORDER.forEach((id,i)=>{const q=P[id];const d=miniPool[i];if(!q.group.visible||q.fade<0.5||id===state.sel||(state.iso&&state.iso!==id)){d.hidden=true;return;}const r=project(q);if(!r.ok){d.hidden=true;return;}d.hidden=false;const t=(q.fixed?'':stepNo(id)+' ')+nm(id);if(d.textContent!==t)d.textContent=t;d.style.left=r.x+'px';d.style.top=r.y+'px';});
}

function gameNext(){const pool=ORDER.filter(id=>!P[id].removed&&!P[id].fixed&&!(P[id].housing&&state.xray));
  const visible=pool;
  let pick=visible[Math.random()*visible.length|0];if(pick===state.quiz&&visible.length>1)pick=visible[(visible.indexOf(pick)+1)%visible.length];
  const others=shuffle(ORDER.filter(id=>id!==pick&&!P[id].fixed&&!(id.startsWith('piston')&&pick.startsWith('piston')))).slice(0,3);
  G.opts=shuffle([pick].concat(others));G.answered=false;state.quiz=pick;state.sel=null;
  if(P[pick].internal&&!state.xray&&!state.cut){state.xray=true;setTog($('tXray'),true);toast(tx('🩻 અંદરનો ભાગ છે — એક્સ-રે ચાલુ કર્યો','🩻 अंदर का भाग है — एक्स-रे चालू किया','🩻 Inner part — X-ray turned on'));}

    '<ol><li>'+tx('બેટરીનો <b>નેગેટિવ (−) ટર્મિનલ</b> પહેલાં કાઢો.','बैटरी का <b>नेगेटिव (−) टर्मिनल</b> पहले निकालें.','Disconnect the battery <b>negative (−) terminal</b> first.')+'</li><li>'+tx('એન્જિન ઠંડું થાય પછી ઓઇલ અને કૂલન્ટ કાઢો (ડ્રેઇન કરો).','इंजन ठंडा होने के बाद ऑयल और कूलेंट निकालें (ड्रेन करें).','Once cool, drain the oil and coolant.')+'</li><li>'+tx('વાયર અને પાઇપ પર લેબલ લગાવો અથવા ફોટો લો.','वायर और पाइप पर लेबल लगाएँ या फोटो लें.','Label wires and hoses, or take photos.')+'</li><li>'+tx('<b>બહારથી અંદર તરફ</b> ખોલો — પહેલાં કવર અને એક્સેસરી, પછી હેડ, છેલ્લે ક્રેન્ક.','<b>बाहर से अंदर की ओर</b> खोलें — पहले कवर और एक्सेसरी, फिर हेड, अंत में क्रैंक.','Work <b>outside in</b> — covers and accessories, then the head, the crank last.')+'</li><li>'+tx('હેડ બોલ્ટ <b>બહારથી વચ્ચે તરફ</b>, 2-3 તબક્કામાં ઢીલા કરો (કસતી વખતે વચ્ચેથી બહાર).','हेड बोल्ट <b>बाहर से बीच की ओर</b>, 2-3 चरणों में ढीले करें (कसते समय बीच से बाहर).','Loosen head bolts <b>from the outside towards the centre</b> in 2-3 stages (tighten centre-out).')+'</li><li>'+tx('હેડ <b>વાલ્વ સાથે જ</b> ઉતરે. બેન્ચ પર <b>વાલ્વ સ્પ્રિંગ કમ્પ્રેસર</b>થી સ્પ્રિંગ દબાવી કોલેટ કાઢો, પછી વાલ્વ કાઢો.','हेड <b>वाल्व के साथ ही</b> उतरता है. बेंच पर <b>वाल्व स्प्रिंग कम्प्रेसर</b> से स्प्रिंग दबाकर कॉलेट निकालें, फिर वाल्व निकालें.','The head comes off <b>with the valves still in it</b>. On the bench, compress each spring with a <b>valve-spring compressor</b>, remove the collets, then the valves.')+'</li><li>'+tx('પિસ્ટન, રોડ કેપ અને મેઇન કેપ પર નંબર/નિશાન કરો — એ જ જગ્યાએ પાછા લગાવો.','पिस्टन, रॉड कैप और मेन कैप पर नंबर/निशान करें — उसी जगह वापस लगाएँ.','Mark pistons, rod caps and main caps — refit them in the same place.')+'</li><li>'+tx('બોલ્ટ ક્રમ પ્રમાણે ટ્રેમાં રાખો. ફરી જોડતી વખતે નવા ગાસ્કેટ અને ટોર્ક રેન્ચ વાપરો.','बोल्ट क्रम से ट्रे में रखें. फिर जोड़ते समय नए गैस्केट और टॉर्क रिंच इस्तेमाल करें.','Keep bolts in order in a tray. On reassembly use new gaskets and a torque wrench.')+'</li></ol>'+

  sec(10,tx('ટર્બોચાર્જર અને ઇન્ટરકૂલર','टर्बोचार्जर और इंटरकूलर','Turbocharger & intercooler'),
    '<p>'+tx('સામાન્ય (નેચરલી એસ્પિરેટેડ) એન્જિન હવા જાતે ખેંચે છે, એટલે સિલિન્ડરમાં વાતાવરણ કરતાં ઓછું દબાણ (≈ 0.9 bar) રહે. <b>ટર્બોચાર્જર</b> હવાને દબાવીને (≈ 1.8 bar) ભરે — એટલે એ જ 2.0 L એન્જિનમાં વધુ હવા + વધુ ફ્યુઅલ = <b>≈ 40–60% વધુ પાવર</b>.','सामान्य (नेचुरली एस्पिरेटेड) इंजन हवा खुद खींचता है, इसलिए सिलेंडर में वायुमंडल से कम दबाव (≈ 0.9 bar) रहता है. <b>टर्बोचार्जर</b> हवा को दबाकर (≈ 1.8 bar) भरता है — यानी उसी 2.0 L इंजन में ज़्यादा हवा + ज़्यादा फ्यूल = <b>≈ 40–60% ज़्यादा पावर</b>.','A naturally aspirated engine sucks air in, so the cylinder fills below atmospheric pressure (≈ 0.9 bar). A <b>turbocharger</b> pushes air in under pressure (≈ 1.8 bar) — the same 2.0 L engine burns more air and fuel and makes <b>≈ 40–60% more power</b>.')+'</p>'+
    '<div class="tb" style="--c:#0891b2"><b>🌀 '+tx('હવાનો રસ્તો','हवा का रास्ता','Air path')+'</b><br>'+tx('એર ફિલ્ટર → ટર્બો કમ્પ્રેસર (હવા દબાય અને ગરમ થાય ≈ 120 °C) → ઇન્ટરકૂલર (ઠંડી ≈ 45 °C) → થ્રોટલ બોડી → ઇનટેક મેનીફોલ્ડ → સિલિન્ડર','एयर फ़िल्टर → टर्बो कम्प्रेसर (हवा दबती और गर्म होती ≈ 120 °C) → इंटरकूलर (ठंडी ≈ 45 °C) → थ्रॉटल बॉडी → इनटेक मैनिफोल्ड → सिलेंडर','Air filter → turbo compressor (air squeezed and heated to ≈ 120 °C) → intercooler (cooled to ≈ 45 °C) → throttle body → intake manifold → cylinder')+'</div>'+
    '<div class="tb" style="--c:#ea580c"><b>🔥 '+tx('એક્ઝોસ્ટનો રસ્તો','एग्ज़ॉस्ट का रास्ता','Exhaust path')+'</b><br>'+tx('સિલિન્ડર → એક્ઝોસ્ટ મેનીફોલ્ડ → ટર્બાઇન (ગેસની ગરમી અને દબાણથી ટર્બાઇન વ્હીલ ફરે) → ડાઉનપાઇપ → કેટાલિટિક કન્વર્ટર → સાઇલેન્સર','सिलेंडर → एग्ज़ॉस्ट मैनिफोल्ड → टर्बाइन (गैस की गर्मी और दबाव से टर्बाइन व्हील घूमता है) → डाउनपाइप → कैटेलिटिक कन्वर्टर → साइलेंसर','Cylinder → exhaust manifold → turbine (the gas heat and pressure spin the turbine wheel) → downpipe → catalytic converter → silencer')+'</div>'+
    '<ul><li><b>'+tx('ટર્બાઇન અને કમ્પ્રેસર એક જ શાફ્ટ પર','टर्बाइन और कम्प्रेसर एक ही शाफ्ट पर','Turbine and compressor share one shaft')+'</b> — '+tx('શાફ્ટ 1.5 લાખ rpm સુધી ફરે, એટલે ટર્બો એન્જિન ઓઇલના દબાણથી ચાલતા બેરિંગ પર ફરે.','शाफ्ट 1.5 लाख rpm तक घूमता है, इसलिए टर्बो इंजन ऑयल के दबाव से चलने वाले बेयरिंग पर घूमता है.','the shaft reaches 150,000 rpm, so it runs on bearings fed by engine oil pressure.')+'</li>'+

 {q:A('MPFI એન્જિનમાં ફ્યુઅલ પ્રેશર રેગ્યુલેટરની હોઝ ઇન્ટેક મેનીફોલ્ડ સાથે કેમ જોડાય છે?','MPFI इंजन में फ्यूल प्रेशर रेगुलेटर की होज़ इनटेक मैनिफोल्ड से क्यों जुड़ती है?','Why is the fuel pressure regulator hose connected to the intake manifold on an MPFI engine?'),o:[A('રેલનું દબાણ મેનીફોલ્ડ કરતાં હંમેશાં સરખું (≈ 3 bar) વધુ રાખવા','रेल का दबाव मैनिफोल्ड से हमेशा बराबर (≈ 3 bar) ज़्यादा रखने के लिए','To keep rail pressure a constant ≈ 3 bar above manifold pressure'),A('ઇન્જેક્ટર ઠંડા રાખવા','इंजेक्टर ठंडे रखने के लिए','To cool the injectors'),A('પેટ્રોલની વરાળ બહાર કાઢવા','पेट्रोल की भाप बाहर निकालने के लिए','To vent petrol vapour'),A('ટર્બો બૂસ્ટ વધારવા','टर्बो बूस्ट बढ़ाने के लिए','To raise turbo boost')],x:A('દબાણનો તફાવત સરખો હોય તો ઇન્જેક્ટર ખુલ્લો રહે એટલા સમયમાં હંમેશાં સરખું પેટ્રોલ છંટાય — વેક્યુમમાં કે બૂસ્ટમાં.','दबाव का अंतर बराबर हो तो इंजेक्टर जितनी देर खुला रहे उतने में हमेशा बराबर पेट्रोल छिड़कता है — वैक्यूम में या बूस्ट में.','With a constant pressure difference, the injector always sprays the same fuel for the same open time — under vacuum or boost.')}

const MQ={started:false,order:[],i:0,ok:0,done:0,wrong:[],ans:false,cur:null};
function mqIntro(){$('mqBox').innerHTML='<div class="card res"><div style="font-size:44px">📝</div><h2 style="font-size:24px">'+tx('એન્જિન MCQ','इंजन MCQ','Engine MCQ')+'</h2><p style="font-size:16px">'+Q.length+' '+tx('પ્રશ્નો','प्रश्न','questions')+'</p><p style="color:var(--mute)">'+tx('ITI, GSRTC હેલ્પર ભરતી અને ટ્રેડ થિયરી પરીક્ષા માટે','ITI, भर्ती परीक्षा और ट्रेड थ्योरी के लिए','For ITI, recruitment and trade-theory exams')+'</p><div class="mact" style="justify-content:center"><button class="btn pri" id="mqGo" style="font-size:18px;padding:12px 22px">▶ '+tx('શરૂ કરો','शुरू करें','Start')+'</button></div></div>';$('mqGo').onclick=()=>{ac();SND.click();mqStart();};}
function mqStart(list){MQ.started=true;Object.assign(MQ,{order:shuffle((list||Q.map((_,i)=>i)).slice()),i:0,ok:0,done:0,wrong:[],ans:false,cur:null});mqRender();}
function mqRender(){const box=$('mqBox');if(!MQ.started){mqIntro();return;}
  if(MQ.i>=MQ.order.length){const p=Math.round(MQ.ok/MQ.done*100)||0;SND.win();buzz([30,40,30]);
    box.innerHTML='<div class="card res"><div style="font-size:40px">'+(p>=80?'🏆':p>=50?'👍':'💪')+'</div><div class="big">'+MQ.ok+' / '+MQ.done+'</div><p style="font-size:18px;font-weight:700">'+p+'% — '+(p>=80?tx('શાનદાર! તમે એન્જિન એક્સપર્ટ છો','शानदार! आप इंजन एक्सपर्ट हैं','Excellent! You\'re an engine expert'):p>=50?tx('સારું! થિયરી ફરી વાંચો','अच्छा! थ्योरी फिर पढ़ें','Good! Read the theory again'):tx('હાર નહીં — સિમ્યુલેટરમાં ભાગ ખોલીને ફરી પ્રયત્ન કરો','हार नहीं — सिम्युलेटर में भाग खोलकर फिर कोशिश करें','Don\'t give up — strip the engine in the simulator and try again'))+'</p><div class="mact" style="justify-content:center"><button class="btn pri" id="mqAgain">🔁 '+tx('ફરી શરૂ','फिर शुरू','Start again')+'</button>'+(MQ.wrong.length?'<button class="btn" id="mqWrong">❌ '+tx('ખોટા ફરી','गलत फिर','Retry wrong')+' ('+MQ.wrong.length+')</button>':'')+'</div></div>';
    $('mqAgain').onclick=()=>mqStart();if($('mqWrong'))$('mqWrong').onclick=()=>mqStart(MQ.wrong.slice());return;}
  const q=Q[MQ.order[MQ.i]];const opts=MQ.cur&&MQ.cur.q===q&&MQ.cur.keep?MQ.cur.opts:shuffle(q.o.map((t,j)=>({t,c:j===0})));MQ.ans=false;MQ.cur={q,opts};
  box.innerHTML='<div class="mhead"><span class="score">'+tx('સાચા:','सही:','Correct:')+' <b>'+MQ.ok+'</b> / '+MQ.done+'</span><div class="mprog"><i style="width:'+(MQ.i/MQ.order.length*100)+'%"></i></div><span class="qno">'+(MQ.i+1)+' / '+MQ.order.length+'</span></div><div class="card"><div class="qno">📝 '+tx('પ્રશ્ન','प्रश्न','Question')+'</div><div class="qtext">'+L3(q.q)+'</div><div class="opts">'+opts.map((o,j)=>'<button class="opt" data-j="'+j+'"><span class="k">'+tx('કખગઘ','कखगघ','ABCD')[j]+'</span><span>'+L3(o.t)+'</span></button>').join('')+'</div></div><div id="mqFb"></div>';}
$('mqBox').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||MQ.ans)return;ac();MQ.ans=true;const j=+b.dataset.j,{q,opts}=MQ.cur,right=opts[j].c;MQ.done++;
  document.querySelectorAll('#mqBox .opt').forEach((x,k)=>{x.disabled=true;if(opts[k].c)x.classList.add('ok');});
  if(right){MQ.ok++;SND.ok();buzz(25);}else{b.classList.add('no');SND.bad();buzz([60,40,60]);MQ.wrong.push(MQ.order[MQ.i]);}
  const praise=[tx('સાચો જવાબ! 🎯','सही उत्तर! 🎯','Correct! 🎯'),tx('એકદમ બરાબર! ✓','बिल्कुल सही! ✓','Spot on! ✓'),tx('શાબાશ! 🔥','शाबाश! 🔥','Well done! 🔥'),tx('વાહ, સાચું! ⭐','वाह, सही! ⭐','Great! ⭐')][Math.random()*4|0];
  $('mqFb').innerHTML='<div class="expl'+(right?'':' bad')+'"><b class="v">'+(right?praise:tx('ખોટો. સાચો જવાબ: ','गलत. सही उत्तर: ','Wrong. Correct answer: ')+L3(q.o[0]))+'</b>'+L3(q.x)+'</div><div class="mact" style="margin-top:10px"><button class="btn pri" id="mqNext">'+tx('આગળ ➜','आगे ➜','Next ➜')+'</button></div>';
  document.querySelector('.mhead .score').innerHTML=tx('સાચા:','सही:','Correct:')+' <b>'+MQ.ok+'</b> / '+MQ.done;
  $('mqNext').onclick=()=>{MQ.i++;SND.click();mqRender();window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});};
  $('mqFb').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'nearest'});});

 ['black','⚫',A('કાળો','काला','Black'),A('કાળો ધુમાડો = વધુ ફ્યુઅલ (રીચ મિશ્રણ): એર ફિલ્ટર જામ, ઇન્જેક્ટર લીક, ખરાબ O₂/MAF સેન્સર. ડીઝલમાં ઓવરલોડ.','काला धुआँ = ज़्यादा फ्यूल (रिच मिश्रण): एयर फ़िल्टर जाम, इंजेक्टर लीक, खराब O₂/MAF सेंसर. डीज़ल में ओवरलोड.','Black smoke = too much fuel (rich mixture): blocked air filter, leaking injector, faulty O₂/MAF sensor. On diesels, overloading.')],
 ['blue','🔵',A('વાદળી','नीला','Blue'),A('વાદળી ધુમાડો = એન્જિન ઓઇલ બળે છે: ઘસાયેલી પિસ્ટન રિંગ, વાલ્વ સ્ટેમ સીલ કે વાલ્વ ગાઇડ. ઓઇલ ઝડપથી ઓછું થાય.','नीला धुआँ = इंजन ऑयल जल रहा है: घिसी पिस्टन रिंग, वाल्व स्टेम सील या वाल्व गाइड. ऑयल जल्दी कम होता है.','Blue smoke = engine oil burning: worn piston rings, valve-stem seals or valve guides. Oil level drops quickly.')],
 ['white','⚪',A('સફેદ','सफेद','White'),A('ગાઢ સફેદ ધુમાડો (ગરમ એન્જિનમાં પણ) = કૂલન્ટ બળે છે: હેડ ગાસ્કેટ ફાટ્યું કે હેડમાં તિરાડ. કૂલન્ટ ઓછું થાય, મીઠી ગંધ આવે.','गाढ़ा सफेद धुआँ (गर्म इंजन में भी) = कूलेंट जल रहा है: हेड गैस्केट फटा या हेड में दरार. कूलेंट कम होता है, मीठी गंध आती है.','Thick white smoke (even when warm) = coolant burning: blown head gasket or cracked head. Coolant drops, sweet smell.')]];

const W=[
 {cam:'cyl',cut:1,from:360,to:360,dur:7,t:A('એન્જિન કેવી રીતે ચાલે છે','इंजन कैसे चलता है','How the engine works'),x:A('કટ-વ્યૂથી એન્જિન અડધું કાપીને અંદર જોઈએ. સિલિન્ડર 1 (ટાઇમિંગ બેલ્ટ બાજુ, આગળ) પર ધ્યાન રાખો. એક સાઇકલમાં ક્રેન્ક 2 આંટા (720°) અને કેમ 1 આંટો ફરે છે.','कट-व्यू से इंजन को आधा काटकर अंदर देखें. सिलेंडर 1 (टाइमिंग बेल्ट की ओर, आगे) पर ध्यान रखें. एक साइकिल में क्रैंक 2 चक्कर (720°) और कैम 1 चक्कर घूमता है.','The cutaway slices the engine in half so we can see inside. Watch cylinder 1 (front, timing-belt end). One cycle takes 2 crank turns (720°) and 1 cam turn.')},
 {cam:'cyl',cut:1,from:360,to:540,dur:8,t:A('1. સક્શન સ્ટ્રોક','1. सक्शन स्ट्रोक','1. Intake stroke'),x:A('પિસ્ટન TDC થી BDC તરફ નીચે જાય. ઇન્ટેક વાલ્વ ખુલ્લો, એક્ઝોસ્ટ બંધ. દબાણ ≈ 0.9 bar (વાતાવરણથી ઓછું) થાય એટલે હવા અંદર ખેંચાય; ઇન્જેક્ટર પેટ્રોલનો ફુવારો મારે 💧. <b style="color:#0284c7">આછો વાદળી</b> = તાજું, ઠંડું (≈ 40 °C) મિશ્રણ.','पिस्टन TDC से BDC की ओर नीचे जाता है. इनटेक वाल्व खुला, एग्ज़ॉस्ट बंद. दबाव ≈ 0.9 bar (वायुमंडल से कम) होता है इसलिए हवा अंदर खिंचती है; इंजेक्टर पेट्रोल की फुहार मारता है 💧. <b style="color:#0284c7">हल्का नीला</b> = ताज़ा, ठंडा (≈ 40 °C) मिश्रण.','The piston moves down from TDC to BDC. Intake valve open, exhaust shut. Pressure falls to ≈ 0.9 bar (below atmospheric), so air is drawn in and the injector sprays petrol 💧. <b style="color:#0284c7">Light blue</b> = fresh, cool (≈ 40 °C) mixture.')},
 {cam:'cyl',cut:1,from:540,to:700,dur:7,t:A('2. કમ્પ્રેશન સ્ટ્રોક','2. कम्प्रेशन स्ट्रोक','2. Compression stroke'),x:A('બંને વાલ્વ બંધ. પિસ્ટન ઉપર જઈ મિશ્રણને 10.5 ગણું નાનું કરે. દબાણ ≈ 1 થી 21 bar અને તાપમાન ≈ 40 થી 400 °C સુધી વધે. રંગ <b style="color:#0284c7">આછા વાદળી</b>માંથી ધીમે ધીમે <b style="color:#d35400">ઘાટો નારંગી</b> થાય = હવા દબાઈને ગરમ થાય છે.','दोनों वाल्व बंद. पिस्टन ऊपर जाकर मिश्रण को 10.5 गुना छोटा करता है. दबाव ≈ 1 से 21 bar और तापमान ≈ 40 से 400 °C तक बढ़ता है. रंग <b style="color:#0284c7">हल्के नीले</b> से धीरे-धीरे <b style="color:#d35400">गहरा नारंगी</b> होता है = हवा दबकर गर्म होती है.','Both valves shut. The piston rises and squeezes the mixture 10.5 times smaller. Pressure climbs from ≈ 1 to 21 bar and temperature from ≈ 40 to 400 °C. The colour turns slowly from <b style="color:#0284c7">light blue</b> to <b style="color:#d35400">dark orange</b> = the air heats as it is squeezed.')},
 {cam:'spark',cut:1,from:698,to:722,dur:7,t:A('3. સ્પાર્ક ⚡','3. स्पार्क ⚡','3. Spark ⚡'),x:A('TDC થી આશરે 15–18° પહેલાં સ્પાર્ક પ્લગ તણખો આપે. મિશ્રણને સળગતાં સમય લાગે છે, એટલે વહેલો સ્પાર્ક આપવાથી સૌથી વધુ દબાણ TDC પછી તરત મળે.','TDC से लगभग 15–18° पहले स्पार्क प्लग चिंगारी देता है. मिश्रण को जलने में समय लगता है, इसलिए जल्दी स्पार्क देने से सबसे ज़्यादा दबाव TDC के ठीक बाद मिलता है.','About 15–18° before TDC the plug fires. The mixture takes time to burn, so sparking early puts peak pressure just after TDC.')},
 {cam:'cyl',cut:1,from:725,to:900,dur:7,t:A('4. પાવર સ્ટ્રોક','4. पावर स्ट्रोक','4. Power stroke'),x:A('બળતા ગેસનું દબાણ ≈ 60 bar અને તાપમાન ≈ 2300 °C સુધી પહોંચે. તે પિસ્ટનને જોરથી નીચે ધકેલે — કામ આપતો એકમાત્ર સ્ટ્રોક. સ્પાર્ક પછી તરત <b style="color:#d4a000">ચમકતો પીળો</b> (સૌથી ગરમ), પછી ગેસ ફેલાઈને ઠંડો થાય તેમ <b style="color:#d35400">ઘાટો નારંગી</b> → <b style="color:#8b1a00">ઘાટો લાલ</b>.','जलती गैस का दबाव ≈ 60 bar और तापमान ≈ 2300 °C तक पहुँचता है. यह पिस्टन को ज़ोर से नीचे धकेलती है — काम देने वाला अकेला स्ट्रोक. स्पार्क के तुरंत बाद <b style="color:#d4a000">चमकीला पीला</b> (सबसे गर्म), फिर गैस फैलकर ठंडी होने पर <b style="color:#d35400">गहरा नारंगी</b> → <b style="color:#8b1a00">गहरा लाल</b>.','The burning gas reaches ≈ 60 bar and ≈ 2300 °C and drives the piston down hard — the only stroke that does work. Right after the spark it is <b style="color:#d4a000">bright yellow</b> (hottest), then as the gas expands and cools it turns <b style="color:#d35400">dark orange</b> → <b style="color:#8b1a00">dark red</b>.')},
 {cam:'cyl',cut:1,from:900,to:1080,dur:7,t:A('5. એક્ઝોસ્ટ સ્ટ્રોક','5. एग्ज़ॉस्ट स्ट्रोक','5. Exhaust stroke'),x:A('એક્ઝોસ્ટ વાલ્વ ખૂલે, પિસ્ટન ઉપર જઈ ≈ 800 °C નો બળેલો ગેસ ≈ 1.1 bar પર મેનિફોલ્ડમાં ધકેલે. ગેસ કેટાલિટિક કન્વર્ટરમાંથી પસાર થઈ ધુમાડા રૂપે બહાર નીકળે. રંગ <b style="color:#8b1a00">ઘાટા લાલ</b>માંથી ધીમે ધીમે <b>કાળો</b> થાય.','एग्ज़ॉस्ट वाल्व खुलता है, पिस्टन ऊपर जाकर ≈ 800 °C की जली गैस ≈ 1.1 bar पर मैनिफोल्ड में धकेलता है. गैस कैटेलिटिक कन्वर्टर से गुज़रकर धुएँ के रूप में बाहर निकलती है. रंग <b style="color:#8b1a00">गहरे लाल</b> से धीरे-धीरे <b>काला</b> होता है.','The exhaust valve opens and the rising piston pushes ≈ 800 °C burnt gas into the manifold at ≈ 1.1 bar. It passes through the catalytic converter and leaves as exhaust smoke. The colour fades from <b style="color:#8b1a00">dark red</b> to <b>black</b>.')},
 {cam:'all',cut:1,from:1080,to:1800,dur:9,t:A('ફાયરિંગ ઓર્ડર 1-3-4-2','फायरिंग ऑर्डर 1-3-4-2','Firing order 1-3-4-2'),x:A('હવે ચારે સિલિન્ડર સાથે જુઓ. દર 180° એ એક સિલિન્ડરમાં પાવર સ્ટ્રોક — ક્રમ 1 → 3 → 4 → 2. નીચેના કાર્ડમાં દરેક સિલિન્ડરનો સ્ટ્રોક, દબાણ અને તાપમાન જુઓ.','अब चारों सिलेंडर साथ देखें. हर 180° पर एक सिलेंडर में पावर स्ट्रोक — क्रम 1 → 3 → 4 → 2. नीचे के कार्ड में हर सिलेंडर का स्ट्रोक, दबाव और तापमान देखें.','Now watch all four. One cylinder fires every 180° in the order 1 → 3 → 4 → 2. The cards show each cylinder\'s stroke, pressure and temperature.')},
 {cam:'air',from:1800,to:2520,dur:8,t:A('હવાનો રસ્તો 💨','हवा का रास्ता 💨','Air path 💨'),x:A('હવા એર ફિલ્ટરના મોઢામાંથી ખેંચાય → ફિલ્ટર ધૂળ રોકે → ડક્ટ → થ્રોટલ બોડી → પ્લેનમ → રનર → ઇન્ટેક પોર્ટ → જે સિલિન્ડર સક્શનમાં હોય તેમાં જાય.','हवा एयर फ़िल्टर के मुँह से खिंचती है → फ़िल्टर धूल रोकता है → डक्ट → थ्रॉटल बॉडी → प्लेनम → रनर → इनटेक पोर्ट → जो सिलेंडर सक्शन में हो उसमें जाती है.','Air is drawn in at the filter mouth → the filter stops dust → duct → throttle body → plenum → runner → intake port → into whichever cylinder is on intake.')},
 {cam:'exh',from:2520,to:3240,dur:8,t:A('એક્ઝોસ્ટ અને ધુમાડો','एग्ज़ॉस्ट और धुआँ','Exhaust & smoke'),x:A('ગરમ ગેસ: પોર્ટ → મેનિફોલ્ડ → કેટાલિટિક કન્વર્ટર → પાઇપમાંથી બહાર. ⚫ કાળો = વધુ ફ્યુઅલ, 🔵 વાદળી = ઓઇલ બળે, ⚪ સફેદ = કૂલન્ટ બળે. સારા એન્જિનનો ધુમાડો લગભગ દેખાય નહીં. "ધુમાડો" બટનથી રંગ બદલી જુઓ.','गर्म गैस: पोर्ट → मैनिफोल्ड → कैटेलिटिक कन्वर्टर → पाइप से बाहर. ⚫ काला = ज़्यादा फ्यूल, 🔵 नीला = ऑयल जलता है, ⚪ सफेद = कूलेंट जलता है. अच्छे इंजन का धुआँ लगभग दिखता नहीं. "धुआँ" बटन से रंग बदलकर देखें.','Hot gas: port → manifold → catalytic converter → out of the pipe. ⚫ Black = too much fuel, 🔵 blue = burning oil, ⚪ white = burning coolant. A healthy engine\'s exhaust is almost invisible. Try the "Smoke" buttons.')},
 {cam:'all',gal:1,from:3240,to:3960,dur:9,t:A('લુબ્રિકેશન 🛢','लुब्रिकेशन 🛢','Lubrication 🛢'),x:A('<b style="color:#f59e0b">નારંગી</b> = ઓઇલ. સમ્પ → પિકઅપ → ઓઇલ પંપ → ફિલ્ટર → મેઇન ગેલેરી → દરેક મેઇન બેરિંગ → ક્રેન્કના છિદ્રથી દરેક બિગ-એન્ડ → દરેક સિલિન્ડરનો પિસ્ટન કૂલિંગ જેટ → હેડમાં દરેક કેમ બેરિંગ → પાછું સમ્પમાં.','<b style="color:#f59e0b">नारंगी</b> = ऑयल. संप → पिकअप → ऑयल पंप → फ़िल्टर → मेन गैलरी → हर मेन बेयरिंग → क्रैंक के छेद से हर बिग-एंड → हर सिलेंडर का पिस्टन कूलिंग जेट → हेड में हर कैम बेयरिंग → वापस संप में.','<b style="color:#f59e0b">Orange</b> = oil. Sump → pickup → oil pump → filter → main gallery → every main bearing → through the crank drillings to every big end → each cylinder\'s piston-cooling jet → every cam bearing in the head → back to the sump.')},
 {cam:'all',gal:1,from:3960,to:4680,dur:8,t:A('કૂલિંગ 💧','कूलिंग 💧','Cooling 💧'),x:A('<b style="color:#0b5cff">વાદળી</b> = કૂલન્ટ. વોટર પંપ → બ્લોકનું વોટર જેકેટ (દરેક સિલિન્ડરની ફરતે) → ઉપરના છિદ્રોથી હેડ → થર્મોસ્ટેટ (88 °C પર ખૂલે) → રેડિએટર → પાછું પંપમાં.','<b style="color:#0b5cff">नीला</b> = कूलेंट. वॉटर पंप → ब्लॉक का वॉटर जैकेट (हर सिलेंडर के चारों ओर) → ऊपर के छेदों से हेड → थर्मोस्टेट (88 °C पर खुले) → रेडिएटर → वापस पंप में.','<b style="color:#0b5cff">Blue</b> = coolant. Water pump → block water jacket (around every cylinder) → up through the transfer holes into the head → thermostat (opens at 88 °C) → radiator → back to the pump.')},
 {cam:'home',from:4680,to:4680,dur:6,t:A('ડેમો પૂરો ✅','डेमो पूरा ✅','Demo complete ✅'),x:A('હવે જાતે કરો: "હાથથી ફેરવો" સ્લાઇડરથી દરેક ડિગ્રી જુઓ, અથવા "ખોલવાનો ડેમો" શરૂ કરો.','अब खुद करें: "हाथ से घुमाएँ" स्लाइडर से हर डिग्री देखें, या "खोलने का डेमो" शुरू करें.','Now try it yourself: step through each degree with "Turn by hand", or start the dismantling demo.')}];
function camPreset(k){const c1=XS[0];if(k==='spark'){animCam(V(c1,2.13,0),V(c1+0.55,2.32,0.95));return;}
  if(k==='cyl')animCam(V(c1,1.8,0),V(c1+2.6,2.9,4.6));else if(k==='all')animCam(V(0,1.4,0),V(5.2,3.6,7.6));
  else if(k==='air')animCam(V(-2.6,2.3,-1.0),V(-7.4,5.0,3.4));else if(k==='exh')animCam(V(-1.0,0.4,1.3),V(2.8,2.6,8.4));else frameHome();}
function plain(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent;}
function speak(t){if(!D.voice||!window.speechSynthesis)return;speechSynthesis.cancel();const code=LANG;const v=speechSynthesis.getVoices().find(q=>q.lang&&q.lang.toLowerCase().startsWith(code));
  if(!v){if(!speak.warned){speak.warned=1;toast(tx('આ ઉપકરણમાં ગુજરાતી અવાજ નથી — લખાણ વાંચો','इस डिवाइस में हिंदी आवाज़ नहीं है — लिखा हुआ पढ़ें','No voice for this language on this device'));}return;}
  const u=new SpeechSynthesisUtterance(plain(t));u.voice=v;u.lang=v.lang;u.rate=0.95;speechSynthesis.speak(u);}
function demoShow(title,text,stepTxt){$('demoCap').hidden=false;document.querySelector('.simmain').classList.add('demo');$('dcTitle').innerHTML=title;$('dcText').innerHTML=text;$('dcStep').textContent=stepTxt;$('dcPause').textContent=D.paused?'▶':'⏸';$('dcPrev').hidden=D.mode!=='work';speak(title+'. '+text);}
function setView(o){state.cut=!!o.cut;state.xray=!!o.xray;state.gal=!!o.gal;setTog($('tCut'),state.cut);setTog($('tXray'),state.xray);setTog($('tGal'),state.gal);$('galLeg').hidden=!state.gal;}
function workStep(i){const w=W[i];D.step=i;D.phase='work';D.t=0;D.dur=w.dur;D.th0=w.from;D.th1=w.to;D.thPrev=w.from;state.theta=((w.from%720)+720)%720;
  setView({cut:w.cut,gal:w.gal,xray:w.gal});camPreset(w.cam);demoShow(L3(w.t),L3(w.x),tx('એન્જિન ડેમો','इंजन डेमो','Engine demo')+' · '+(i+1)+' / '+W.length);}
function stripStep(){const p=nextPart();
  if(!p){D.phase='end';D.t=0;D.dur=6;state.sel=null;refresh();frameHome();demoShow('🎉 '+tx('બધું ખૂલી ગયું','सब खुल गया','Fully stripped'),tx('ફક્ત બ્લોક સ્ટેન્ડ પર બાકી છે અને હેડ બેન્ચ પર છે. હવે "જોડવાનો ડેમો" થી ઊંધા ક્રમમાં ફરી જોડી શકાય.','सिर्फ ब्लॉक स्टैंड पर बचा है और हेड बेंच पर है. अब "जोड़ने का डेमो" से उल्टे क्रम में फिर जोड़ सकते हैं.','Only the block is left on the stand and the head is on the bench. Use the assembly demo to rebuild in reverse order.'),'');return;}
  D.id=p.id;D.phase='show';D.t=0;D.count=removable.filter(id=>P[id].removed).length+1;state.sel=p.id;refresh();frameFrom(p.id);
  D.dur=Math.min(12,Math.max(5,plain(L3(p.h)).length/20+3));
  demoShow(L3(p.n),'<b>🔧 '+tx('કેવી રીતે ખોલવું:','कैसे खोलें:','How to remove:')+'</b> '+L3(p.h)+'<span class="dcSub">'+L3(p.d)+'</span>',tx('ખોલવાનો ડેમો','खोलने का डेमो','Dismantling demo')+' · '+D.count+' / '+removable.length);}
function buildStep(){const id=state.stack[state.stack.length-1];
  if(!id){D.phase='end';D.t=0;D.dur=6;state.sel=null;refresh();frameHome();demoShow('🎉 '+tx('એન્જિન ફરી તૈયાર','इंजन फिर तैयार','Engine rebuilt'),tx('બધા ભાગ ઊંધા ક્રમમાં જોડાઈ ગયા. અસલમાં દરેક બોલ્ટ ટોર્ક રેન્ચથી સાચા ટોર્ક પર કસો અને બધા ગાસ્કેટ-સીલ નવા વાપરો.','सभी भाग उल्टे क्रम में जुड़ गए. असल में हर बोल्ट टॉर्क रिंच से सही टॉर्क पर कसें और सभी गैस्केट-सील नए लगाएँ.','Every part is back in reverse order. In the workshop, torque every bolt with a torque wrench and fit new gaskets and seals.'),'');return;}
  const p=P[id];D.id=id;D.phase='show';D.t=0;state.sel=id;refresh();frameFrom(id);D.dur=6;
  demoShow('↩ '+L3(p.n),'<b>🔩 '+tx('ફિટિંગ / ટોર્ક:','फिटिंग / टॉर्क:','Fixing / torque:')+'</b> '+L3(p.f)+'<span class="dcSub">'+L3(p.d)+'</span>',tx('જોડવાનો ડેમો','जोड़ने का डेमो','Assembly demo')+' · '+(removable.length-state.stack.length+1)+' / '+removable.length);}
function demoStart(mode){ac();if(D.mode)demoStop(true);state.auto=null;state.pending=null;state.iso=null;if(state.quiz){state.quiz=null;gameRender();}
  D.mode=mode;D.paused=false;D.save={xray:state.xray,cut:state.cut,gal:state.gal};
  if(mode==='work'){if(ORDER.some(id=>P[id].removed)){ORDER.forEach(id=>{P[id].removed=false;});state.stack=[];toast(tx('ડેમો માટે આખું એન્જિન ફરી જોડ્યું','डेमो के लिए पूरा इंजन फिर जोड़ा','Engine reassembled for the demo'));}
    state.running=false;setTog($('tRun'),false);state.flow=true;setTog($('tFlow'),true);state.explode=0;$('explode').value=0;$('explodeOut').textContent='0%';state.sel=null;refresh();workStep(0);}
  else{setView({});if(mode==='strip')stripStep();else buildStep();}
  renderDemoCard();}
function demoStop(silent){if(!D.mode)return;const was=D.mode;D.mode=null;$('demoCap').hidden=true;document.querySelector('.simmain').classList.remove('demo');if(window.speechSynthesis)speechSynthesis.cancel();
  if(was==='work'&&D.save)setView(D.save);renderDemoCard();if(!silent)SND.click();}
function demoAdvance(){
  if(D.mode==='work'){if(D.step+1<W.length)workStep(D.step+1);else{demoStop();SND.win();}return;}
  if(D.phase==='end'){demoStop();SND.win();return;}
  if(D.phase==='show'){if(D.mode==='strip')removePart(D.id);else installPart(D.id);D.phase='gap';D.t=0;D.dur=1.4;return;}
  if(D.phase==='gap'){if(D.mode==='strip')stripStep();else buildStep();}}
function demoTick(dt){if(!D.mode||D.paused)return;D.t+=dt*D.speed;
  if(D.phase==='work'){const f=Math.min(1,D.t/(D.dur*0.9));const th=D.th0+(D.th1-D.th0)*f;state.handD+=th-D.thPrev;D.thPrev=th;state.theta=((th%720)+720)%720;$('crank').value=Math.round(state.theta);}
  $('dcBar').style.width=Math.min(100,D.t/D.dur*100)+'%';
  const speaking=D.voice&&window.speechSynthesis&&speechSynthesis.speaking;
  if(D.t>=D.dur&&!speaking)demoAdvance();}
function renderDemoCard(){$('dTitle').innerHTML='🎬 '+tx('ડેમો — જુઓ અને શીખો','डेमो — देखो और सीखो','Demo — watch and learn');
  const lab=(m,ic,t)=>D.mode===m?'⏹ '+tx('ડેમો બંધ કરો','डेमो बंद करें','Stop demo'):ic+' '+t;
  $('dWork').textContent=lab('work','▶',tx('એન્જિન કેવી રીતે ચાલે છે (4 સ્ટ્રોક)','इंजन कैसे चलता है (4 स्ट्रोक)','How the engine works (4 strokes)'));
  $('dStrip').textContent=lab('strip','🔧',tx('ખોલવાનો ડેમો — દરેક ભાગ, સાધન સાથે','खोलने का डेमो — हर भाग, औज़ार के साथ','Dismantling demo — every part, with tools'));
  $('dBuild').textContent=lab('build','🔁',tx('જોડવાનો ડેમો — ટોર્ક સાથે','जोड़ने का डेमो — टॉर्क के साथ','Assembly demo — with torque figures'));
  $('dBuild').disabled=!state.stack.length&&D.mode!=='build';
  $('dSpdL').textContent=tx('ઝડપ','गति','Speed');$('dVoice').textContent='🗣 '+tx('બોલીને સમજાવો','बोलकर समझाएँ','Read aloud');setTog($('dVoice'),D.voice);
  $('dSpeed').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===D.speed)));}
$('dWork').onclick=()=>D.mode==='work'?demoStop():demoStart('work');
$('dStrip').onclick=()=>D.mode==='strip'?demoStop():demoStart('strip');
$('dBuild').onclick=()=>D.mode==='build'?demoStop():demoStart('build');
$('dSpeed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;D.speed=+b.dataset.s;SND.click();renderDemoCard();});
$('dVoice').onclick=()=>{D.voice=!D.voice;SND.click();if(!D.voice&&window.speechSynthesis)speechSynthesis.cancel();renderDemoCard();};
$('dcPause').onclick=()=>{D.paused=!D.paused;$('dcPause').textContent=D.paused?'▶':'⏸';if(window.speechSynthesis){D.paused?speechSynthesis.pause():speechSynthesis.resume();}};
$('dcNext').onclick=()=>{if(window.speechSynthesis)speechSynthesis.cancel();D.t=D.dur;demoAdvance();};
$('dcPrev').onclick=()=>{if(D.mode==='work')workStep(Math.max(0,D.step-1));};
$('dcStop').onclick=()=>demoStop();

/* ---------------- loop ---------------- */
function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);resize();
/* full screen: real browser full screen when allowed; otherwise fill the window (e.g. inside a frame) */
function fsLabel(){const on=document.body.classList.contains('fs');const b=$('fsBtn');if(!b)return;b.textContent=on?'✕ '+tx('ફુલ સ્ક્રીન બંધ','फुल स्क्रीन बंद','Exit full screen'):'⛶ '+tx('ફુલ સ્ક્રીન','फुल स्क्रीन','Full screen');b.setAttribute('aria-pressed',String(on));}
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function fsSet(on){document.body.classList.toggle('fs',on);fsLabel();setTimeout(resize,60);}
function fsEnter(){const d=document.documentElement,rq=d.requestFullscreen||d.webkitRequestFullscreen;
  const fallback=()=>{document.body.classList.add('fsx');fsSet(true);};
  if(!rq||!(document.fullscreenEnabled||document.webkitFullscreenEnabled)){fallback();return;}
  try{const r=rq.call(d);if(r&&r.catch)r.catch(fallback);}catch(e){fallback();}}
function fsExit(){if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{document.body.classList.remove('fsx');fsSet(false);}}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{document.body.classList.remove('fsx');fsSet(!!fsEl());}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('fsx')){document.body.classList.remove('fsx');fsSet(false);}});
$('fsBtn').onclick=()=>{ac();SND.click();document.body.classList.contains('fs')?fsExit():fsEnter();};
// on a computer, the first click anywhere opens full screen automatically (browsers allow it only after a click)
if(matchMedia('(min-width:980px) and (pointer:fine)').matches){const once=e=>{document.removeEventListener('pointerdown',once,true);if(e.target.closest&&e.target.closest('#fsBtn'))return;if(!document.body.classList.contains('fs')&&(document.fullscreenEnabled||document.webkitFullscreenEnabled))fsEnter();};document.addEventListener('pointerdown',once,true);}
fsLabel();
/* auto-height when embedded (blog): same message as the other ITI labs */
(function(){if(window.parent===window)return;let lastH=0;const send=()=>{if(document.body.classList.contains('fs'))return;const w=document.querySelector('.wrap');const h=Math.ceil(w.getBoundingClientRect().bottom+(window.scrollY||0)+8);if(Math.abs(h-lastH)>4){lastH=h;try{window.parent.postMessage({dmHeight:h},"*");}catch(e){}}};
  try{new ResizeObserver(send).observe(document.querySelector('.wrap'));}catch(e){setInterval(send,800);}window.addEventListener("load",send);setTimeout(send,600);document.addEventListener('click',()=>setTimeout(send,350));})();
let last=performance.now(),uiTick=0;
/* render only while something changes (camera, engine, animation, input) — idle engine costs ~0 GPU */
let WAKE=performance.now();const wake=()=>{WAKE=performance.now();};
['pointerdown','pointermove','wheel','keydown','input','change','click','touchmove'].forEach(e=>addEventListener(e,wake,{passive:true,capture:true}));
controls.addEventListener('change',wake);new ResizeObserver(wake).observe(view);document.addEventListener('visibilitychange',wake);
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  demoTick(dt);
  let dDeg=state.handD;state.handD=0;
  if(state.running){const before=state.theta;const r=state.crankT>0?Math.min(state.rpm,150):state.rpm;if(state.crankT>0)state.crankT-=dt;const vis=r<=180?r:180+(r-180)*0.15;const d=dt*vis*6;dDeg+=d;state.theta=(state.theta+d)%720;
    if(AC&&!MUTE&&state.tab==='sim'&&state.crankT<=0&&state.rpm<=600&&!P.piston1.removed){for(let k=0;k<4;k++){const c0=cycleAngle(k,before),c1=cycleAngle(k,state.theta);if(c1<c0){SND.fire();break;}}}}
  if(dDeg)state.lastTurn=now;
  {const fw=P.flywheel.group,tg=fw.getObjectByName('teeth'),tb=fw.getObjectByName('teethBlur');const fast=Math.abs(dDeg)>1.2;if(tg){tg.visible=!fast;tb.visible=fast;}}
  if(state.pending){state.pending.t-=dt;$('bCd').style.width=Math.max(0,100*(1-state.pending.t/state.pending.T))+'%';
    if(state.pending.t<=0){const id=state.pending.id;state.pending=null;$('bCd').style.width='0';if(!removePart(id))refresh();}}
  else if($('bCd').style.width&&$('bCd').style.width!=='0px')$('bCd').style.width='0';
  if(state.auto){state.autoT-=dt;if(state.autoT<=0){state.autoT=0.55;
    if(state.auto==='strip'){const n=nextPart();if(n)removePart(n.id);else{state.auto=null;renderDock();SND.win();}}
    else{if(state.stack.length)installPart(state.stack[state.stack.length-1]);else{state.auto=null;renderDock();SND.win();}}}}
  if(state.camAnim){const a=state.camAnim;a.t=Math.min(1,a.t+dt*1.8);const e=a.t*a.t*(3-2*a.t);controls.target.lerpVectors(a.ft,a.tt,e);camera.position.lerpVectors(a.fp,a.tp,e);if(a.t>=1)state.camAnim=null;}
  if(dDeg||state.running||state.pending||state.auto||state.camAnim||D.mode)WAKE=now;
  const live=now-WAKE<1200&&!document.hidden;
  if(state.tab==='sim'&&view.clientWidth&&live){updateMechanics();updateParts(dt,now);updateFx();updateFlows(dDeg,dt,now-state.lastTurn<700);controls.update();renderer.shadowMap.needsUpdate=true;renderer.render(scene,camera);updateLabels();if(++uiTick%4===0)updateCycleUI();}
  else gasLabEls.forEach(l=>l.hidden=true);
  requestAnimationFrame(loop);}
setTog($('tColor'),false);
applyUI();refresh();updateCycleUI(true);gameRender();mqIntro();
requestAnimationFrame(loop);
})();
</script>
